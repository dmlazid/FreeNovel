<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f3}
header{background:#00897b;color:#fff;padding:16px;font-size:28px;font-weight:bold}
.container{padding:20px}
.card{background:#fff;border-radius:20px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.cover{width:220px;max-width:100%;border-radius:12px}
.btn{display:block;background:#00897b;color:#fff;text-decoration:none;padding:16px;border-radius:30px;margin:12px 0;font-weight:bold}
</style>
</head>
<body>

<header>📚 FreeNovel</header>

<div class="container">
  <div class="card" id="novel">Loading...</div>
</div>

<script>
const id=new URLSearchParams(location.search).get("id");

async function load(){
 const data=await fetch("data/"+id+".json").then(r=>r.json());

 document.getElementById("novel").innerHTML=`
 <img class="cover" src="${data.cover}" onerror="this.src='https://placehold.co/300x420?text=No+Cover'">
 <h1>${data.title}</h1>
 <p>By ${data.author}</p>
 <p>${data.genre}</p>
 <p>${data.chapters.length} Volumes · Ongoing</p>
 <h2>Volumes</h2>
 ${data.chapters.map((v,i)=>
 `<a class="btn" href="reader.html?id=${id}&ch=${i}">${v.title}</a>`
 ).join("")}
 `;
}
load();
</script>

</body>
</html>
