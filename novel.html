<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Poppins,sans-serif;
background:#e7eceb;
}
header{
background:#00897b;
padding:16px;
position:sticky;
top:0;
}
.logo{
height:52px;
}
.container{
max-width:760px;
margin:auto;
padding:20px;
}
.card{
background:#fff;
border-radius:22px;
padding:22px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.cover{
width:200px;
display:block;
margin:0 auto 20px;
border-radius:12px;
}
h1{
text-align:center;
color:#00897b;
font-size:30px;
margin:0 0 8px;
}
.meta{
text-align:center;
color:#666;
margin-bottom:18px;
}
.volumes{
display:flex;
flex-direction:column;
gap:14px;
margin-top:20px;
}
.btn{
display:block;
background:#00897b;
color:#fff;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:14px;
font-size:20px;
font-weight:600;
transition:.2s;
}
.btn:active{
transform:scale(.98);
}
</style>
</head>
<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo" alt="FreeNovel">
</a>
</header>

<div class="container">
<div class="card">

<img src="covers/new-life-young-again.png" class="cover">

<h1>[New Life+] Young Again in Another World</h1>

<div class="meta">
Mine (Illustrator Kaboccha)<br>
Action • Adventure • Comedy • Fantasy • Romance
</div>

<div class="volumes">
<a class="btn" href="read.html?id=new-life-young-again&ch=0">📖 Volume 1</a>
<a class="btn" href="read.html?id=new-life-young-again&ch=1">📖 Volume 2</a>
<a class="btn" href="read.html?id=new-life-young-again&ch=2">📖 Volume 3</a>
</div>

</div>
</div>

</body>
</html>
