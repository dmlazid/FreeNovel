<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Arial,sans-serif;
  background:#dfe4e4;
}
header{
  background:#00897b;
  padding:18px;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:42px;
}
.container{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:#fff;
  border-radius:28px;
  padding:25px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.viewer{
  width:100%;
  height:78vh;
  border:none;
  border-radius:15px;
  background:#eee;
}
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
}
.btn{
  background:#00897b;
  color:#fff;
  border:none;
  border-radius:30px;
  padding:14px 28px;
  font-size:18px;
  cursor:pointer;
}
.page{
  font-size:20px;
  font-weight:bold;
}
.back{
  display:block;
  margin-top:20px;
  text-align:center;
  background:#00897b;
  color:#fff;
  text-decoration:none;
  padding:16px;
  border-radius:30px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">
<div class="card">

<h1 id="title">Loading...</h1>

<iframe id="viewer" class="viewer"></iframe>

<div class="controls">
<button class="btn" onclick="prevPage()">◀ Prev</button>
<div class="page" id="pageNum">Page 1</div>
<button class="btn" onclick="nextPage()">Next ▶</button>
</div>

<a id="backNovel" class="back">← Back to Novel</a>

</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const ch = parseInt(params.get("ch") || "1");

let page = 1;
let pdf = "";

async function loadReader(){

  const novel = await fetch(`data/${id}.json`).then(r=>r.json());

  const chapter = novel.chapters[ch-1];

  if(!chapter) throw "Chapter not found";

  document.getElementById("title").innerText =
    novel.title + " — " + chapter.title;

  document.getElementById("backNovel").href =
    "novel.html?id=" + id;

  pdf = chapter.pdf;

  loadPage();
}

function loadPage(){
  document.getElementById("viewer").src =
    pdf + "#page=" + page + "&zoom=page-width";

  document.getElementById("pageNum").innerText =
    "Page " + page;
}

function nextPage(){
  page++;
  loadPage();
}

function prevPage(){
  if(page>1){
    page--;
    loadPage();
  }
}

loadReader().catch(err=>{
  document.querySelector(".card").innerHTML=`
    <h1>Reader Error</h1>
    <p style="text-align:center;margin:20px 0;">${err}</p>
    <a class="back" href="index.html">← Back Home</a>
  `;
});
</script>

</body>
</html>
