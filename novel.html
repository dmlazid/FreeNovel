<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#dfe5e5;
  font-family:Arial,sans-serif;
}
header{
  background:#00897b;
  padding:20px;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:42px;
}
.container{padding:20px;}
.card{
  background:#fff;
  border-radius:30px;
  padding:25px;
  text-align:center;
}
.cover{
  width:220px;
  border-radius:20px;
  display:block;
  margin:0 auto 20px;
}
h1{
  font-size:30px;
  margin-bottom:12px;
}
.info{
  color:#444;
  margin:8px 0;
}
.volumes{
  display:flex;
  flex-direction:column;
  gap:15px;
  margin-top:25px;
}
.btn{
  display:block;
  background:#00897b;
  color:#fff;
  text-decoration:none;
  padding:18px;
  border-radius:35px;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>
<body>

<header>
  <a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">
  <div class="card" id="novel">
    Loading...
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id")||"new-life-young-again";

async function loadNovel(){

  const data=await fetch(`data/${id}.json`).then(r=>r.json());

  let buttons="";

  data.chapters.forEach((chapter,index)=>{
    buttons+=`
      <a class="btn"
      href="read.html?id=${id}&ch=${index+1}">
      ${chapter.title}
      </a>`;
  });

  document.getElementById("novel").innerHTML=`
    <img class="cover" src="${data.cover}" alt="${data.title}">
    <h1>${data.title}</h1>

    <p class="info">${data.author}</p>
    <p class="info">${data.genre}</p>
    <p class="info">${data.chapters.length} Volumes • Ongoing</p>

    <div class="volumes">
      ${buttons}
    </div>
  `;
}

loadNovel().catch(()=>{
  document.getElementById("novel").innerHTML=`
    <h2>Novel not found</h2>
    <a class="btn" href="index.html">← Back Home</a>
  `;
});
</script>

</body>
</html>
