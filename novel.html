<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel</title>

<style>
body{margin:0;background:#dfe5e5;font-family:Arial}
header{background:#00897b;padding:18px}
header a{color:#fff;text-decoration:none;font-size:42px}
.card{background:#fff;margin:20px;border-radius:25px;padding:20px;text-align:center}
.cover{width:70%;max-width:280px;border-radius:20px}
.btn{
display:block;
margin:15px auto;
background:#00897b;
color:white;
padding:18px;
border-radius:35px;
text-decoration:none;
font-size:22px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div id="app" class="card">Loading...</div>

<script>
const id=new URLSearchParams(location.search).get("id");

fetch(`data/${id}.json`)
.then(r=>r.json())
.then(book=>{

let html=`
<img class="cover" src="${book.cover}">
<h1>${book.title}</h1>
<p>${book.author}</p>
<p>${book.genre}</p>
<h2>Volumes</h2>
`;

book.chapters.forEach((v,i)=>{
html+=`
<a class="btn" href="read.html?id=${book.id}&ch=${i+1}">
${v.title}
</a>
`;
});

document.getElementById("app").innerHTML=html;

})
.catch(()=>{
document.getElementById("app").innerHTML="<h2>Novel not found.</h2>";
});
</script>

</body>
</html>
