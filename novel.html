<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Poppins,sans-serif;
  background:#d9dddd;
  color:#222;
}

header{
  background:#00897B;
  padding:16px 20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
  text-decoration:none;
  font-size:30px;
  font-weight:700;
}

.logo img{
  width:46px;
  height:46px;
  object-fit:contain;
}

.container{
  max-width:760px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:40px 24px;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.card h1{
  color:#00897B;
  font-size:34px;
  margin-bottom:12px;
}

.card p{
  color:#666;
  font-size:18px;
  margin-bottom:28px;
}

button{
  background:#00897B;
  color:#fff;
  border:none;
  border-radius:14px;
  padding:16px 28px;
  font:600 18px Poppins;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" onerror="this.style.display='none'">
    <span>FreeNovel</span>
  </a>
</header>

<div class="container">
  <div class="card">
    <h1>New Novel</h1>
    <p>This page is empty and ready for your next novel.</p>
    <button onclick="history.back()">Go Back</button>
  </div>
</div>

</body>
</html>
