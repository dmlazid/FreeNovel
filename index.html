<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#d9dddd;
    color:#222;
}

header{
    background:#00897B;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    font-size:30px;
    font-weight:700;
}

.logo img{
    width:46px;
    height:46px;
    object-fit:contain;
}

.menu{
    font-size:34px;
    color:white;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:auto;
    padding:22px;
}

.search{
    width:100%;
    padding:18px 24px;
    border:2px solid #cfcfcf;
    border-radius:999px;
    font-family:Poppins;
    font-size:18px;
    background:white;
    outline:none;
}

.tags{
    display:flex;
    gap:12px;
    overflow-x:auto;
    margin:24px 0;
    padding-bottom:6px;
}

.tags::-webkit-scrollbar{
    display:none;
}

.tag{
    background:#00897B;
    color:white;
    padding:12px 24px;
    border-radius:999px;
    white-space:nowrap;
    font-size:18px;
}

.divider{
    height:8px;
    background:#bdbdbd;
    margin:8px 0 22px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:700;
    margin-bottom:18px;
}

.empty{
    background:white;
    border-radius:24px;
    padding:48px 24px;
    text-align:center;
    color:#666;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.empty h3{
    color:#00897B;
    margin-bottom:8px;
    font-size:24px;
}
</style>
</head>
<body>

<header>

<a href="index.html" class="logo">
    <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/29/29302.png'">
    <span>FreeNovel</span>
</a>

<div class="menu">☰</div>

</header>

<div class="container">

<input class="search" type="text" placeholder="Search novels...">

<div class="tags">
    <div class="tag">Fantasy</div>
    <div class="tag">Action</div>
    <div class="tag">Romance</div>
    <div class="tag">Horror</div>
    <div class="tag">Comedy</div>
    <div class="tag">Adventure</div>
</div>

<div class="divider"></div>

<div class="section-title">
    🔥 Latest Updates
</div>

<div class="empty">
    <h3>No novels yet</h3>
    <p>Add your first novel later.</p>
</div>

</div>

</body>
</html>
