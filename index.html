
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
<div class="logo">📚 FreeNovel</div>
<div class="menu" onclick="openMenu()">☰</div>
</header>
<div id="sideMenu" class="side-menu">

<a href="javascript:void(0)" onclick="closeMenu()">✕ Close</a>

<a href="#">🏠 Home</a>
<a href="#">🔥 Popular</a>
<a href="#">🆕 Latest</a>
<a href="#">📚 Categories</a>
<a href="#">⭐ Completed</a>

</div>
<div class="search">
<input id="searchInput" type="text" placeholder="Search novels..." onkeyup="searchNovel()">
</div>

<div class="categories">
<button onclick="filterGenre('Fantasy')">Fantasy</button>
<button onclick="filterGenre('Action')">Action</button>
<button onclick="filterGenre('Romance')">Romance</button>
<button onclick="filterGenre('Horror')">Horror</button>
<button onclick="filterGenre('Comedy')">Comedy</button>
<button onclick="filterGenre('Sci-Fi')">Sci-Fi</button>
</div>


<div class="section">

<h2>🔥 Latest Updates</h2>

<div id="latest" class="novel-grid"></div>
<h2 style="margin-top:30px">⭐ Popular Novels</h2>

<div id="popular" class="novel-grid"></div>

<h2 style="margin-top:30px">✅ Completed</h2>

<div id="completed" class="novel-grid"></div>

</div>

<footer>© 2026 FreeNovel</footer>
<script>
// Side menu
function openMenu(){
  document.getElementById("sideMenu").style.width="260px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width="0";
}

// Search
function searchNovel(){
  const text=document.getElementById("searchInput").value.toLowerCase();

  document.querySelectorAll(".card").forEach(card=>{
    card.style.display=card.innerText.toLowerCase().includes(text)
      ? "block"
      : "none";
  });
}

// Load novels
fetch("data/novels.json")
.then(r=>r.json())
.then(showNovels);

function showNovels(novels){

  const latest=document.getElementById("latest");
  const popular=document.getElementById("popular");
  const completed=document.getElementById("completed");

  novels.forEach(n=>{

    const card=`
      <div class="card">
        <img src="${n.cover}">
        <div class="info">
          <h3>${n.title}</h3>
          <p>${n.author}</p>
          <p>${n.genre} • ${n.chapters} Chapters • ${n.status}</p>
          <a class="read" href="reader.html">Read Now</a>
        </div>
      </div>
    `;

    latest.innerHTML+=card;
    popular.innerHTML+=card;

    if(n.status==="Completed"){
      completed.innerHTML+=card;
    }
  });
}
</script>
