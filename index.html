
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f5f7}
header{
background:#00897B;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}
.logo{font-size:24px;font-weight:bold}
.menu{font-size:28px;cursor:pointer}
.search{
padding:15px;
background:white;
}
.search input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:25px;
}
.categories{
display:flex;
overflow-x:auto;
gap:10px;
padding:15px;
background:white;
}
.categories button{
background:#00897B;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
white-space:nowrap;
}
.section{padding:20px}
.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}
.card img{
width:100%;
height:220px;
object-fit:cover;
}
.info{padding:15px}
.read{
display:inline-block;
margin-top:10px;
background:#00897B;
color:white;
padding:10px 20px;
border-radius:20px;
text-decoration:none;
}
footer{
text-align:center;
padding:25px;
color:#666;
}
  .side-menu{
height:100%;
width:0;
position:fixed;
top:0;
left:0;
background:#00695C;
overflow-x:hidden;
transition:.3s;
padding-top:60px;
z-index:999;
}

.side-menu a{
display:block;
color:white;
padding:16px 24px;
text-decoration:none;
font-size:18px;
}

.side-menu a:hover{
background:#00897B;
}
</style>
</head>
<body>

<header>
<div class="logo">📚 FreeNovel</div>
<div class="menu" onclick="openMenu()">☰</div>
</header>
<div id="sideMenu" class="side-menu">

<a href="javascript:void(0)" onclick="closeMenu()">✕ Close</a>

<a href="#">🏠 Home</a>
<a href="#">🔥 Popular</a>
<a href="#">🆕 Latest</a>
<a href="#">📚 Categories</a>
<a href="#">⭐ Completed</a>

</div>
<div class="search">
<input type="text" placeholder="Search novels...">
</div>

<div class="categories">
<button>Fantasy</button>
<button>Action</button>
<button>Romance</button>
<button>Horror</button>
<button>Comedy</button>
<button>Sci-Fi</button>
</div>


<div class="section">

<h2>🔥 Latest Updates</h2>

<div id="latest"></div>

<h2 style="margin-top:30px">⭐ Popular Novels</h2>

<div id="popular"></div>

<h2 style="margin-top:30px">✅ Completed</h2>

<div id="completed"></div>

</div>

<footer>© 2026 FreeNovel</footer>

<script>
function openMenu(){
  document.getElementById("sideMenu").style.width="260px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width="0";
}

fetch("data/novels.json")
  .then(r=>r.json())
  .then(showNovels);
function showNovels(novels){

const latest=document.getElementById("latest");
const popular=document.getElementById("popular");
const completed=document.getElementById("completed");

novels.forEach(n=>{

const card=`
<div class="card">
<img src="${n.cover}">
<div class="info">
<h3>${n.title}</h3>
<p>${n.author}</p>
<p>${n.genre} • ${n.chapters} Chapters • ${n.status}</p>
<a class="read" href="reader.html">Read Now</a>
</div>
</div>
`;

latest.innerHTML+=card;
popular.innerHTML+=card;

if(n.status==="Completed"){
completed.innerHTML+=card;
}

});
}
</script>
