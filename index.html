<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeNovel</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>
  <button type="button" class="logo-btn" onclick="window.location.replace('./index.html')">
    📚 FreeNovel
  </button>

  <div class="menu" onclick="openMenu()">☰</div>
</header>

<div id="sideMenu" class="side-menu">
  <a href="javascript:void(0)" onclick="closeMenu()">✕ Close</a>
  <a href="./index.html">🏠 Home</a>
  <a href="#popular">🔥 Popular</a>
  <a href="#latest">🆕 Latest</a>
  <a href="#latest">📚 Categories</a>
  <a href="#completed">⭐ Completed</a>
</div>

<div class="search">
  <input
    id="searchInput"
    type="text"
    placeholder="Search novels..."
    onkeyup="searchNovel()">
</div>

<div class="categories">
  <button onclick="filterGenre('Fantasy')">Fantasy</button>
  <button onclick="filterGenre('Action')">Action</button>
  <button onclick="filterGenre('Romance')">Romance</button>
  <button onclick="filterGenre('Horror')">Horror</button>
  <button onclick="filterGenre('Comedy')">Comedy</button>
  <button onclick="filterGenre('Sci-Fi')">Sci-Fi</button>
</div>

<div class="section">

  <h2>🔥 Latest Updates</h2>
  <div id="latest" class="novel-grid"></div>

  <h2 style="margin-top:30px;">⭐ Popular Novels</h2>
  <div id="popular" class="novel-grid"></div>

  <h2 style="margin-top:30px;">✅ Completed</h2>
  <div id="completed" class="novel-grid"></div>

</div>

<footer>© 2026 FreeNovel</footer>

<script src="assets/js/app.js"></script>

</body>
</html>
