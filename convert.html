<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel One-Click Converter</title>
<style>
body{font-family:system-ui;background:#f3f3f3;margin:0;padding:24px}
.card{max-width:720px;margin:auto;background:#fff;padding:24px;border-radius:16px}
h1{color:#00897b;text-align:center}
input,button{width:100%;padding:14px;font-size:16px;margin-top:12px;border-radius:8px;border:1px solid #ccc}
button{background:#00897b;color:#fff;border:none;font-weight:600}
#log{white-space:pre-wrap;background:#f7f7f7;padding:16px;border-radius:8px;margin-top:16px}
</style>
</head>
<body>

<div class="card">
<h1>📚 One-Click PDF → GitHub</h1>

<input id="token" type="password" placeholder="GitHub Personal Access Token">

<button onclick="convertAll()">Convert & Upload</button>

<div id="log">Ready.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const OWNER="dmlazid";
const REPO="FreeNovel";
const BRANCH="main";
const BOOK="new-life-young-again";

const volumes=[
["Volume 1","pdfs/new-life-young-again-v1.pdf","v1.json"],
["Volume 2","pdfs/new-life-young-again-v2.pdf","v2.json"],
["Volume 3","pdfs/new-life-young-again-v3.pdf","v3.json"]
];

const log=document.getElementById("log");
const write=t=>log.textContent+="\n"+t;

async function pdfText(url){
 const pdf=await pdfjsLib.getDocument(url).promise;
 let text="";
 for(let p=1;p<=pdf.numPages;p++){
  const page=await pdf.getPage(p);
  const tc=await page.getTextContent();
  let y=null;
  tc.items.forEach(i=>{
   if(y!==null&&Math.abs(i.transform[5]-y)>8) text+="\n";
   text+=i.str+" ";
   y=i.transform[5];
  });
  text+="\n\n";
 }
 return text
 .replace(/Table of Contents[\s\S]*?Prologue:/i,"Prologue:")
 .replace(/Cover/gi,"")
 .replace(/Color Illustrations/gi,"")
 .trim();
}

async function upload(path,obj,token){

 const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;

 let sha=null;
 const old=await fetch(api,{headers:{Authorization:"token "+token}});
 if(old.ok) sha=(await old.json()).sha;

 const content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))));

 await fetch(api,{
  method:"PUT",
  headers:{
   Authorization:"token "+token,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   message:"Auto convert PDF to JSON",
   content,
   branch:BRANCH,
   sha
  })
 });

}

async function convertAll(){

 const token=document.getElementById("token").value.trim();

 if(!token){
  alert("Enter GitHub token.");
  return;
 }

 log.textContent="Starting...\n";

 for(const [title,pdf,file] of volumes){

  write("Converting "+title+"...");

  const text=await pdfText(pdf);

  await upload(
   `chapters/${BOOK}/${file}`,
   {title,text},
   token
  );

  write("✓ Uploaded "+file);

 }

 write("\nDone! Refresh your site.");
}
</script>

</body>
</html>
