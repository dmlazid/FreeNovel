<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Converter</title>

<style>
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#f3f3f3;
  padding:25px;
}
.card{
  max-width:700px;
  margin:auto;
  background:white;
  border-radius:16px;
  padding:24px;
}
h1{
  color:#00897b;
  text-align:center;
}
button{
  width:100%;
  padding:16px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:#00897b;
  color:white;
  cursor:pointer;
}
#log{
  margin-top:20px;
  background:#f7f7f7;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  font-size:15px;
}
</style>
</head>
<body>

<div class="card">

<h1>📚 Convert All PDFs</h1>

<p>This converts every PDF into JSON chapter files automatically.</p>

<button onclick="convertAll()">Convert All</button>

<div id="log">Ready.</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const bookId="new-life-young-again";

const volumes=[
  {title:"Volume 1",pdf:"pdfs/new-life-young-again-v1.pdf"},
  {title:"Volume 2",pdf:"pdfs/new-life-young-again-v2.pdf"},
  {title:"Volume 3",pdf:"pdfs/new-life-young-again-v3.pdf"}
];

const log=document.getElementById("log");

function write(msg){
  log.textContent+=`\n${msg}`;
}

async function convertVolume(vol,index){

  write(`Converting ${vol.title}...`);

  const pdf=await pdfjsLib.getDocument(vol.pdf).promise;

  let text="";

  for(let p=1;p<=pdf.numPages;p++){

    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();

    let lastY=null;

    tc.items.forEach(item=>{

      const y=item.transform[5];

      if(lastY!==null && Math.abs(y-lastY)>8)
        text+="\n";

      text+=item.str+" ";

      lastY=y;

    });

    text+="\n\n";
  }

  text=text
    .replace(/Table of Contents[\s\S]*?Prologue:/i,"Prologue:")
    .replace(/Cover/gi,"")
    .replace(/Color Illustrations/gi,"")
    .trim();

  const json={
    title:vol.title,
    text:text
  };

  const blob=new Blob(
    [JSON.stringify(json,null,2)],
    {type:"application/json"}
  );

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`v${index+1}.json`;
  a.click();

  await new Promise(r=>setTimeout(r,600));

  write(`✓ Downloaded v${index+1}.json`);

}

async function convertAll(){

  log.textContent="Starting conversion...\n";

  for(let i=0;i<volumes.length;i++){

    try{
      await convertVolume(volumes[i],i);
    }catch(e){
      write(`❌ Failed: ${volumes[i].title}`);
      write(e.message);
    }

  }

  write("\nDone!");
  write("Upload the downloaded files into:");
  write(`chapters/${bookId}/`);

}
</script>

</body>
</html>
