<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Chapter Converter</title>

<style>
body{
font-family:system-ui,-apple-system,sans-serif;
background:#f3f3f3;
margin:0;
padding:24px;
}
.card{
max-width:720px;
margin:auto;
background:white;
padding:24px;
border-radius:16px;
}
h1{
text-align:center;
color:#00897b;
}
button{
width:100%;
padding:16px;
font-size:18px;
border:none;
border-radius:10px;
background:#00897b;
color:white;
font-weight:bold;
}
#log{
margin-top:20px;
background:#f7f7f7;
padding:15px;
border-radius:10px;
white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="card">

<h1>📚 Convert All PDFs</h1>

<button onclick="convertAll()">Convert All Chapters</button>

<div id="log">Ready.</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDFs=[
"pdfs/new-life-young-again-v1.pdf",
"pdfs/new-life-young-again-v2.pdf",
"pdfs/new-life-young-again-v3.pdf"
];

const log=document.getElementById("log");

function write(t){
log.textContent+="\n"+t;
}

async function pdfToText(url){

const pdf=await pdfjsLib.getDocument(url).promise;

let text="";

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);
const tc=await page.getTextContent();

let y=null;

tc.items.forEach(i=>{

if(y!==null&&Math.abs(i.transform[5]-y)>8)
text+="\n";

text+=i.str+" ";

y=i.transform[5];

});

text+="\n\n";

}

return text;
}

function clean(text){

text=text.replace(/\r/g,"");

text=text.replace(/Table of Contents[\s\S]*?(?=(?:\n|\r\n)Prologue:|(?:\n|\r\n)Chapter\s*1:)/i,"");

text=text.replace(/^Cover$/gim,"");
text=text.replace(/^Color Illustrations$/gim,"");
text=text.replace(/^Copyright$/gim,"");
text=text.replace(/^About J-Novel Club$/gim,"");

const pros=[...text.matchAll(/(^|\n)Prologue:/gm)];

if(pros.length>=2)
text=text.slice(pros[1].index);

text=text.replace(/\n{3,}/g,"\n\n").trim();

return text;

}

function split(text){

const regex=/(^|\n)(Prologue:.*?|Chapter\s+\??\d+:.*?|Interlude:.*?|Epilogue:.*?|Afterword)/gm;

const matches=[...text.matchAll(regex)];

const chapters=[];

for(let i=0;i<matches.length;i++){

const start=matches[i].index;
const end=i+1<matches.length?matches[i+1].index:text.length;

const chunk=text.slice(start,end).trim();

const title=matches[i][2].replace(/\n/g," ").trim();

chapters.push({
title,
text:chunk
});

}

return chapters;

}

async function convertAll(){

log.textContent="Starting...\n";

let all=[];

for(const pdf of PDFs){

write("Reading "+pdf);

let text=await pdfToText(pdf);

text=clean(text);

const chapters=split(text);

all.push(...chapters);

}

const list=[];

for(let i=0;i<all.length;i++){

const name=`chapter-${i+1}.json`;

list.push({
id:i+1,
title:all[i].title,
file:name
});

const blob=new Blob(
[JSON.stringify(all[i],null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download=name;
a.click();

await new Promise(r=>setTimeout(r,300));

}

const blob=new Blob(
[JSON.stringify(list,null,2)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="chapters.json";
a.click();

write("\nDone!");
write("Upload every chapter-*.json and chapters.json");
write("to chapters/new-life-young-again/");

}
</script>

</body>
</html>
