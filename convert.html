<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convert PDF</title>

<style>
body{
font-family:system-ui;
padding:30px;
background:#f3f3f3;
}
button,input{
font-size:20px;
margin-top:15px;
}
pre{
white-space:pre-wrap;
background:white;
padding:20px;
border-radius:10px;
max-height:300px;
overflow:auto;
}
</style>
</head>
<body>

<h1>PDF → JSON Converter</h1>

<p>Select a PDF.</p>

<input type="file" id="file" accept=".pdf">

<p>Volume number:</p>

<input type="number" id="volume" value="1" min="1">

<br><br>

<button onclick="convert()">Convert</button>

<pre id="status"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function convert(){

const file=document.getElementById("file").files[0];

if(!file)return;

const vol=document.getElementById("volume").value;

const bytes=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument({data:bytes}).promise;

let text="";

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);

const t=await page.getTextContent();

let lastY=null;

t.items.forEach(i=>{

const y=i.transform[5];

if(lastY!==null&&Math.abs(y-lastY)>8)
text+="\n";

text+=i.str+" ";

lastY=y;

});

text+="\n\n";

}

text=text
.replace(/Table of Contents[\s\S]*?Prologue:/i,"Prologue:")
.replace(/Cover/gi,"")
.replace(/Color Illustrations/gi,"");

const json={
title:`Volume ${vol}`,
text:text.trim()
};

const blob=new Blob([JSON.stringify(json,null,2)],{type:"application/json"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download=`v${vol}.json`;

a.click();

status.textContent="Done! Upload "+`v${vol}.json`+" into chapters/new-life-young-again/";

}
</script>

</body>
</html>
