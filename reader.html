
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:#eef1f3;
color:#222;
}
.topbar{
background:#00897B;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}
.logo{font-weight:700;font-size:22px}
.icon{font-size:24px}

.breadcrumb{
background:white;
padding:12px 18px;
font-size:14px;
color:#666;
}

.book{
background:white;
margin:15px;
border-radius:18px;
padding:18px;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cover{
width:120px;
height:170px;
border-radius:12px;
object-fit:cover;
margin:auto;
display:block;
}

.book h2{
margin:12px 0 6px;
font-size:22px;
}

.chapter-title{
font-size:18px;
color:#666;
}

.chapter-list{
display:flex;
gap:10px;
overflow:auto;
padding:15px;
}

.chapter-list button{
background:#00897B;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
white-space:nowrap;
}

.reader{
background:white;
margin:15px;
border-radius:18px;
padding:22px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
line-height:2;
font-size:19px;
white-space:pre-wrap;
}

.controls{
display:flex;
justify-content:space-between;
padding:15px;
}

.controls button{
background:#00897B;
color:white;
border:none;
padding:12px 20px;
border-radius:25px;
font-size:16px;
}

.tools{
display:flex;
justify-content:center;
gap:18px;
padding:15px;
}

.tools button{
background:white;
border:none;
width:50px;
height:50px;
border-radius:50%;
font-size:20px;
box-shadow:0 3px 8px rgba(0,0,0,.12);
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">📚 FreeNovel</div>
<div class="icon">☰</div>
</div>

<div class="breadcrumb">
Home › Demo Survival Novel
</div>

<div class="book">
<img class="cover" src="https://picsum.photos/300/420?random=1">
<h2 id="title">Loading...</h2>
<div class="chapter-title" id="chapterName"></div>
</div>

<div class="chapter-list" id="chapterList"></div>

<div class="tools">
<button onclick="changeSize(-1)">A−</button>
<button onclick="toggleDark()">🌙</button>
<button onclick="changeSize(1)">A+</button>
</div>

<div class="reader" id="content"></div>

<div class="controls">
<button onclick="prev()">◀ Prev</button>
<button onclick="next()">Next ▶</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const chapter = Number(params.get("chapter") || 1);

fetch("data/novels.json")
.then(r => r.json())
.then(novels => {
  const n = novels.find(book => book.id === id);
  if (!n) return;

  document.getElementById("title").innerText = n.title;
  document.getElementById("chapterName").innerText = "Chapter " + chapter;
  document.querySelector(".cover").src = n.cover;
  document.querySelector(".breadcrumb").innerHTML =
    `<button class="home-btn" onclick="window.location.href='./index.html'">🏠 Home</button> › ${n.title}`;

  document.getElementById("content").innerHTML = `
    <p><b>${n.title} - Chapter ${chapter}</b></p>
    <p>This is Chapter ${chapter} of ${n.title}.</p>
    <p>Author: ${n.author}</p>
    <p>Genre: ${n.genre}</p>
    <p>Story continues here...</p>`;

  const list = document.getElementById("chapterList");
  list.innerHTML = "";
  const max = Math.min(n.chapters, 20);

  for (let i = 1; i <= max; i++) {
    list.innerHTML += `
      <button onclick="window.location.href='reader.html?id=${n.id}&chapter=${i}'">${i}</button>`;
  }
});

function prev() {
  const p = Math.max(1, chapter - 1);
  window.location.href = `reader.html?id=${id}&chapter=${p}`;
}

function next() {
  window.location.href = `reader.html?id=${id}&chapter=${chapter + 1}`;
}

let font = 19;
function changeSize(x){
  font += x;
  document.getElementById("content").style.fontSize = font + "px";
}

function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
