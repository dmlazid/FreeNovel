<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f3}
header{background:#00897b;padding:15px}
header a{color:#fff;text-decoration:none;font-size:30px}
iframe{width:100%;height:100vh;border:none}
</style>
</head>
<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<iframe id="pdf"></iframe>

<script>
const p=new URLSearchParams(location.search);
const id=p.get("id");
const ch=Number(p.get("ch")||0);

fetch(`data/${id}.json`)
.then(r=>r.json())
.then(data=>{
document.getElementById("pdf").src=data.chapters[ch].pdf+"#toolbar=0";
});
</script>

</body>
</html>
