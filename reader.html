<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f3}
header{background:#00897b;color:#fff;padding:16px;font-size:24px;font-weight:bold}
header a{color:#fff;text-decoration:none}
.container{padding:20px}
.card{background:#fff;border-radius:20px;padding:20px}
h1{margin-top:0}
#pdf{width:100%;height:75vh;border:none;border-radius:12px;background:#eee}
.nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.nav button{width:46px;height:46px;border:none;border-radius:50%;background:#00897b;color:#fff;font-size:18px}
</style>
</head>
<body>

<header><a href="index.html">📚 FreeNovel</a></header>

<div class="container">
<div class="card">
<h1 id="title">Loading...</h1>
<h2 id="volume"></h2>

<div class="nav" id="buttons"></div>

<iframe id="pdf"></iframe>
</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
let vol=parseInt(params.get("ch"))||0;

fetch(`data/${id}.json`)
.then(r=>r.json())
.then(data=>{
document.getElementById("title").textContent=data.title;

const list=data.chapters||[];

function loadVolume(i){
vol=i;
document.getElementById("volume").textContent=list[i].title;
document.getElementById("pdf").src=list[i].pdf;
history.replaceState({}, "", `reader.html?id=${id}&ch=${i}`);
}

const buttons=document.getElementById("buttons");
buttons.innerHTML="";
list.forEach((v,i)=>{
const b=document.createElement("button");
b.textContent=i+1;
b.onclick=()=>loadVolume(i);
buttons.appendChild(b);
});

loadVolume(Math.min(vol,list.length-1));
});
</script>

</body>
</html>
