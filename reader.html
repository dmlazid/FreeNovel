<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eceff1}
header{background:#00897b;color:#fff;padding:16px;font-size:28px;font-weight:bold}
.container{padding:20px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
iframe{width:100%;height:80vh;border:none;border-radius:12px}
.nav{display:flex;justify-content:space-between;margin-top:20px}
button{background:#00897b;color:#fff;border:none;padding:14px 22px;border-radius:30px;font-size:18px}
button:disabled{opacity:.4}
</style>
</head>
<body>

<header>📚 FreeNovel</header>

<div class="container">
  <div class="card">
    <h1 id="title"></h1>
    <h2 id="volume"></h2>

    <iframe id="viewer"></iframe>

    <div class="nav">
      <button id="prev">◀ Prev</button>
      <button id="next">Next ▶</button>
    </div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
let ch=parseInt(params.get("ch")||0);

async function load(){
 const data=await fetch("data/"+id+".json").then(r=>r.json());

 document.getElementById("title").textContent=data.title;
 document.getElementById("volume").textContent=data.chapters[ch].title;
 document.getElementById("viewer").src=data.chapters[ch].pdf;

 document.getElementById("prev").disabled=(ch===0);
 document.getElementById("next").disabled=(ch===data.chapters.length-1);

 document.getElementById("prev").onclick=()=>location=`reader.html?id=${id}&ch=${ch-1}`;
 document.getElementById("next").onclick=()=>location=`reader.html?id=${id}&ch=${ch+1}`;
}
load();
</script>

</body>
</html>
