<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";
</script>

<style>
body{
font-family:Arial,sans-serif;
background:#eef2f3;
padding:20px;
max-width:700px;
margin:auto;
}
h2{
font-size:42px;
margin-bottom:20px;
}
input,textarea{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ccc;
border-radius:12px;
box-sizing:border-box;
font-size:16px;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#00897B;
color:white;
font-size:18px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
}
button:disabled{
opacity:.6;
cursor:not-allowed;
}
label{
display:block;
font-size:28px;
margin-top:14px;
margin-bottom:6px;
}
#status{
margin-top:16px;
white-space:pre-wrap;
font-size:15px;
}
</style>
</head>

<body>

<h2>📚 Upload Novel</h2>

<input id="title" placeholder="Novel title">

<input id="author" placeholder="Author">

<input id="genre" placeholder="Genre">

<label>Cover Image</label>
<input id="coverFile" type="file" accept="image/*">

<label>Novel PDFs (Select as many as you want)</label>
<input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple>

<input id="token" type="password" placeholder="GitHub Personal Access Token">

<input id="repo" value="dmlazid/FreeNovel">

<input id="branch" value="main">

<button id="publishBtn" onclick="publishNovel()">🚀 Publish to GitHub</button>

<div id="status"></div>

<script>

const statusBox=document.getElementById("status");

function log(msg){
statusBox.textContent+=msg+"\n";
}

async function uploadFile(token,repo,path,content){

const url=`https://api.github.com/repos/${repo}/contents/${path}`;

let sha;

const old=await fetch(url,{
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
}
});

if(old.ok){
sha=(await old.json()).sha;
}

const bytes=content instanceof Uint8Array
?content
:new Uint8Array(content);

await fetch(url,{
method:"PUT",
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
},
body:JSON.stringify({
message:`Upload ${path}`,
content:btoa(String.fromCharCode(...bytes)),
sha
})
});

}

async function publishNovel(){

const btn=document.getElementById("publishBtn");

btn.disabled=true;

statusBox.textContent="";

try{

const token=document.getElementById("token").value.trim();
const repo=document.getElementById("repo").value.trim();
const branch=document.getElementById("branch").value.trim();

const title=document.getElementById("title").value.trim();
const author=document.getElementById("author").value.trim();
const genre=document.getElementById("genre").value.trim();

if(!title)throw"Title required.";
if(!token)throw"GitHub token required.";

const pdfFiles=Array.from(document.getElementById("pdfInput").files);

if(pdfFiles.length===0)throw"Choose one or more PDFs.";

const id=title.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

const coverFile=document.getElementById("coverFile").files[0];
const cover=coverFile?`covers/${id}.jpg`:"";

let raw="";

log(`Found ${pdfFiles.length} PDF(s)`);

for(const pdfFile of pdfFiles){

log(`Uploading ${pdfFile.name}`);

await uploadFile(
token,
repo,
`pdfs/${pdfFile.name}`,
await pdfFile.arrayBuffer()
);

const pdf=await pdfjsLib.getDocument({
data:await pdfFile.arrayBuffer()
}).promise;

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);

const text=await page.getTextContent();

raw+=text.items.map(i=>i.str).join(" ")+"\n";

}

}

let chapters=raw
.split(/(?=Chapter\s+\d+)/i)
.filter(x=>x.trim());

if(chapters.length===0){

chapters=[raw];

}

const json={
title,
author,
cover,
description:"",
chapters:[]
};

for(let i=0;i<chapters.length;i++){

const file=`chapters/${id}/ch${i+1}.txt`;

await uploadFile(
token,
repo,
file,
new TextEncoder().encode(chapters[i])
);

json.chapters.push({
title:`Chapter ${i+1}`,
file
});

log(`Uploaded Chapter ${i+1}`);

}

await uploadFile(
token,
repo,
`data/${id}.json`,
new TextEncoder().encode(
JSON.stringify(json,null,2)
)
);

if(coverFile){

log("Uploading cover");

await uploadFile(
token,
repo,
cover,
await coverFile.arrayBuffer()
);

}

let novels=[];

try{

const res=await fetch(
`https://raw.githubusercontent.com/${repo}/${branch}/data/novels.json`
);

if(res.ok){

novels=await res.json();

}

}catch(e){}

novels=novels.filter(n=>n.id!==id);

novels.push({
id,
title,
author,
cover,
genre,
status:"Ongoing",
chapters:chapters.length
});

await uploadFile(
token,
repo,
"data/novels.json",
new TextEncoder().encode(
JSON.stringify(novels,null,2)
)
);

alert("Novel published successfully!");

}catch(err){

alert(err);

}

btn.disabled=false;

}

</script>

</body>
</html>
