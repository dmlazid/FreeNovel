<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#eef2f3;
padding:20px;
max-width:700px;
margin:auto;
}
input,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}
button{
background:#00897B;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#00796B;
}
label{
font-weight:bold;
display:block;
margin-top:15px;
}
</style>
</head>

<body>

<h2>📚 Upload Novel</h2>

<input id="title" placeholder="Novel title">
<input id="author" placeholder="Author">
<input id="genre" placeholder="Genre">

<label>Cover Image</label>
<input id="coverFile" type="file" accept="image/*">

<label>Novel PDFs (Select as many as you want)</label>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple>

<input id="token" type="password" placeholder="GitHub Personal Access Token">
<input id="repo" value="dmlazid/FreeNovel">
<input id="branch" value="main">

<button onclick="publish()">🚀 Publish to GitHub</button>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";

async function uploadFile(token, repo, branch, path, content){

const url=`https://api.github.com/repos/${repo}/contents/${path}`;

let sha=null;

const old=await fetch(url,{
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
}
});

if(old.ok){
sha=(await old.json()).sha;
}

const bytes=content instanceof Uint8Array?content:new Uint8Array(content);

const binary=Array.from(bytes,x=>String.fromCharCode(x)).join("");

const body={
message:`Upload ${path}`,
content:btoa(binary)
};

if(sha) body.sha=sha;

const res=await fetch(url,{
method:"PUT",
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
},
body:JSON.stringify(body)
});

if(!res.ok){
const err=await res.text();
throw new Error(err);
}
}

async function publish(){

try{

const token=document.getElementById("token").value.trim();
const repo=document.getElementById("repo").value.trim();
const branch=document.getElementById("branch").value.trim();

const title=document.getElementById("title").value.trim();
const author=document.getElementById("author").value.trim();
const genre=document.getElementById("genre").value.trim();

if(!token) return alert("Enter GitHub token.");
if(!title) return alert("Enter title.");

const id=title.toLowerCase().replace(/[^a-z0-9]+/g,"-");

const coverFile=document.getElementById("coverFile").files[0];
const pdfFiles=Array.from(document.getElementById("pdfInput").files);

if(pdfFiles.length===0){
return alert("Choose one or more PDFs.");
}

let raw="";

for(const pdfFile of pdfFiles){

const pdf=await pdfjsLib.getDocument({
data:await pdfFile.arrayBuffer()
}).promise;

await uploadFile(
token,
repo,
branch,
`pdfs/${pdfFile.name}`,
await pdfFile.arrayBuffer()
);

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);

const text=await page.getTextContent();

raw+=text.items.map(i=>i.str).join(" ")+"\n";

}

}

const chapters=raw
.split(/(?=Chapter\s+\d+)/i)
.filter(x=>x.trim());

const json={
title,
author,
cover:coverFile?`covers/${id}.jpg`:"",
description:"",
chapters:[]
};

for(let i=0;i<chapters.length;i++){

const file=`chapters/${id}/ch${i+1}.txt`;

await uploadFile(
token,
repo,
branch,
file,
new TextEncoder().encode(chapters[i])
);

json.chapters.push({
title:`Chapter ${i+1}`,
file
});

}

await uploadFile(
token,
repo,
branch,
`data/${id}.json`,
new TextEncoder().encode(JSON.stringify(json,null,2))
);

if(coverFile){

await uploadFile(
token,
repo,
branch,
`covers/${id}.jpg`,
await coverFile.arrayBuffer()
);

}

let novels=[];

const res=await fetch("data/novels.json");

if(res.ok){
novels=await res.json();
}

novels=novels.filter(n=>n.id!==id);

novels.push({
id,
title,
author,
cover:coverFile?`covers/${id}.jpg`:"",
chapters:chapters.length,
status:"Ongoing",
genre
});

await uploadFile(
token,
repo,
branch,
"data/novels.json",
new TextEncoder().encode(JSON.stringify(novels,null,2))
);

alert("Novel published successfully!");

}catch(e){

console.error(e);
alert(e.message);

}

}
</script>

</body>
</html>
