<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Admin</title>
<style>
body{font-family:Arial;padding:20px;background:#eef2f3}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
button{background:#00897b;color:#fff;border:none;font-size:16px}
#log{white-space:pre-wrap;background:#fff;padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>
<body>

<h2>📚 Upload Novel</h2>

<input id="title" placeholder="Novel title">
<input id="author" placeholder="Author">
<input id="genre" placeholder="Genre">

<label>Cover</label>
<input id="coverFile" type="file" accept="image/*">

<label>Novel PDFs (multiple)</label>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple>

<input id="token" type="password" placeholder="GitHub Personal Access Token">
<input id="repo" value="dmlazid/FreeNovel">
<input id="branch" value="main">

<button id="publishBtn">🚀 Publish to GitHub</button>

<div id="log"></div>

<script>
const logBox=document.getElementById("log");
function log(t){logBox.textContent+=t+"\n";}

async function uploadFile(token,repo,path,file){
 const branch=document.getElementById("branch").value.trim();
 const url=`https://api.github.com/repos/${repo}/contents/${path}`;
 const bytes=new Uint8Array(await file.arrayBuffer());
 let binary="";
 for(let i=0;i<bytes.length;i+=0x8000){
   binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
 }
 let sha;
 const old=await fetch(url+`?ref=${branch}`,{
  headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"}
 });
 if(old.ok) sha=(await old.json()).sha;

 const res=await fetch(url,{
  method:"PUT",
  headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"},
  body:JSON.stringify({
   message:`Upload ${path}`,
   content:btoa(binary),
   branch,
   sha
  })
 });
 if(!res.ok) throw new Error(await res.text());
}

async function publish(){

 const btn=document.getElementById("publishBtn");
 btn.disabled=true;

 try{

 const token=document.getElementById("token").value.trim();
 const repo=document.getElementById("repo").value.trim();
 const title=document.getElementById("title").value.trim();
 const author=document.getElementById("author").value.trim();
 const genre=document.getElementById("genre").value.trim();
 const cover=document.getElementById("coverFile").files[0];
 const pdfs=Array.from(document.getElementById("pdfInput").files);

 if(!token) throw new Error("Enter GitHub token.");
 if(!title) throw new Error("Enter title.");
 if(pdfs.length===0) throw new Error("Choose at least one PDF.");

 const id=title.toLowerCase().replace(/[^a-z0-9]+/g,"-");

 log(`Uploading ${pdfs.length} PDFs...`);

 for(const pdf of pdfs){
   log("Uploading "+pdf.name);
   await uploadFile(token,repo,`pdfs/${pdf.name}`,pdf);
 }

 if(cover){
   log("Uploading cover...");
   await uploadFile(token,repo,`covers/${id}.jpg`,cover);
 }

 const chapterList=pdfs.map((p,i)=>({
   title:`Volume ${i+1}`,
   pdf:`pdfs/${p.name}`
 }));

 const jsonBlob=new Blob([JSON.stringify({
   id,title,author,genre,
   cover:cover?`covers/${id}.jpg`:"",
   chapters:chapterList
 },null,2)],{type:"application/json"});

 await uploadFile(token,repo,`data/${id}.json`,new File([jsonBlob],`${id}.json`));

 let novels=[];
 const branch=document.getElementById("branch").value.trim();
 const old=await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/data/novels.json`);
 if(old.ok){
   try{novels=await old.json();}catch{}
 }

 novels=novels.filter(n=>n.id!==id);

 novels.push({
   id,title,author,genre,
   cover:cover?`covers/${id}.jpg`:"",
   volumes:pdfs.length
 });

 const novelsBlob=new Blob([JSON.stringify(novels,null,2)],{type:"application/json"});

 await uploadFile(token,repo,"data/novels.json",new File([novelsBlob],"novels.json"));

 log("Done!");
 alert("Published successfully!");

 }catch(e){
   alert(e.message);
   log("ERROR: "+e.message);
 }finally{
   btn.disabled=false;
 }

}

document.getElementById("publishBtn").addEventListener("click",publish);
</script>

</body>
</html>
