<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#eef2f3;
padding:20px;
max-width:700px;
margin:auto;
}
h1{font-size:32px}
input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:1px solid #ccc;
box-sizing:border-box;
}
label{
display:block;
margin-top:18px;
font-weight:bold;
font-size:22px;
}
button{
width:100%;
padding:16px;
margin-top:20px;
background:#00897B;
color:white;
border:none;
border-radius:14px;
font-size:20px;
cursor:pointer;
}
button:disabled{
background:#777;
cursor:not-allowed;
}
#log{
margin-top:20px;
white-space:pre-wrap;
font-size:15px;
}
</style>
</head>

<body>

<h1>📚 Upload Novel</h1>

<input id="title" placeholder="Novel title">
<input id="author" placeholder="Author">
<input id="genre" placeholder="Genre">

<label>Cover Image</label>
<input id="coverFile" type="file" accept="image/*">

<label>Novel PDFs (Select as many as you want)</label>
<input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple>

<input id="token" type="password" placeholder="GitHub Personal Access Token">
<input id="repo" value="dmlazid/FreeNovel">
<input id="branch" value="main">

<button id="publishBtn" onclick="publish()">🚀 Publish to GitHub</button>

<div id="log"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";

const log=t=>{
document.getElementById("log").textContent+=t+"\n";
};

async function uploadFile(token,repo,path,content){

const url=`https://api.github.com/repos/${repo}/contents/${path}`;

let sha=null;

const old=await fetch(url,{
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
}
});

if(old.ok) sha=(await old.json()).sha;

const bytes=content instanceof Uint8Array?content:new Uint8Array(content);

let binary="";
const chunk=0x8000;

for(let i=0;i<bytes.length;i+=chunk){
binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
}

const base64=btoa(binary);

const res=await fetch(url,{
method:"PUT",
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
},
body:JSON.stringify({
message:`Upload ${path}`,
content:base64,
sha
})
});

if(!res.ok){
throw new Error(await res.text());
}
}

async function publish(){

const btn=document.getElementById("publishBtn");
btn.disabled=true;
document.getElementById("log").textContent="";

try{

const token=document.getElementById("token").value.trim();
const repo=document.getElementById("repo").value.trim();

const title=document.getElementById("title").value.trim();
const author=document.getElementById("author").value.trim();
const genre=document.getElementById("genre").value.trim();

if(!title) throw new Error("Title is required.");
if(!token) throw new Error("GitHub token is required.");

const id=title.toLowerCase().replace(/[^a-z0-9]+/g,"-");

const coverFile=document.getElementById("coverFile").files[0];
const cover=coverFile?`covers/${id}.jpg`:"";

const pdfFiles=[...document.getElementById("pdfInput").files];

if(pdfFiles.length===0)
throw new Error("Choose one or more PDFs.");

log(`Found ${pdfFiles.length} PDF(s)`);

let raw="";

for(const pdfFile of pdfFiles){

log(`Uploading ${pdfFile.name}`);

await uploadFile(
token,
repo,
`pdfs/${pdfFile.name}`,
await pdfFile.arrayBuffer()
);

const pdf=await pdfjsLib.getDocument({
data:await pdfFile.arrayBuffer()
}).promise;

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);
const text=await page.getTextContent();

raw+=text.items.map(i=>i.str).join(" ")+"\n";

}

}

const chapters=raw
.split(/(?=Chapter\s+\d+)/i)
.filter(x=>x.trim());

const json={
title,
author,
cover,
description:"",
chapters:[]
};

for(let i=0;i<chapters.length;i++){

const file=`chapters/${id}/ch${i+1}.txt`;

await uploadFile(token,repo,file,new TextEncoder().encode(chapters[i]));

json.chapters.push({
title:`Chapter ${i+1}`,
file
});

}

await uploadFile(
token,
repo,
`data/${id}.json`,
new TextEncoder().encode(JSON.stringify(json,null,2))
);

if(coverFile){

log("Uploading cover");

await uploadFile(
token,
repo,
`covers/${id}.jpg`,
await coverFile.arrayBuffer()
);

}

let novels=[];

try{

const r=await fetch("data/novels.json");

if(r.ok) novels=await r.json();

}catch(e){}

novels=novels.filter(n=>n.id!==id);

novels.push({
id,
title,
author,
cover,
genre,
status:"Ongoing",
chapters:chapters.length
});

await uploadFile(
token,
repo,
"data/novels.json",
new TextEncoder().encode(JSON.stringify(novels,null,2))
);

alert("Novel published successfully!");

}catch(err){

console.error(err);
alert(err.message);

}

btn.disabled=false;

}
</script>

</body>
</html>
