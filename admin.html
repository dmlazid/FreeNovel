<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Admin</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
font-family:Arial;
background:#eef2f3;
padding:20px;
}
input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}
textarea{
height:260px;
}
button{
background:#00897B;
color:white;
padding:14px;
border:none;
border-radius:10px;
width:100%;
font-size:16px;
}
</style>

</head>
<body>

<h2>📚 Upload Novel</h2>

<input id="title" placeholder="Novel title">

<input id="author" placeholder="Author">

<input id="genre" placeholder="Genre">

<input id="cover" placeholder="Cover image URL">

<textarea id="text"
placeholder="Paste your whole novel here.

Example:

Chapter 1
Story...

Chapter 2
More story...
"></textarea>
  
<input id="token" type="password" placeholder="GitHub Personal Access Token">

<input id="repo" value="dmlazid/FreeNovel" placeholder="Repository">

<input id="branch" value="main" placeholder="Branch">

<input id="fileInput" type="file" accept=".txt,.docx,.pdf">
  
<button onclick="publish()">🚀 Publish to GitHub</button>

<script>

async function build(){

const title=titleInput("title");
const author=titleInput("author");
const genre=titleInput("genre");
const cover=titleInput("cover");

const id=title.toLowerCase()
.replace(/[^a-z0-9]+/g,"-");

const raw=document.getElementById("text").value;

const chapters=raw.split(/(?=Chapter\s+\d+)/i)
.filter(x=>x.trim());

const zip=new JSZip();

const chapterFolder=zip.folder("chapters").folder(id);

const json={
title,
author,
cover,
description:"",
chapters:[]
};

chapters.forEach((c,i)=>{

chapterFolder.file(`ch${i+1}.txt`,c.trim());

json.chapters.push({
title:`Chapter ${i+1}`,
file:`chapters/${id}/ch${i+1}.txt`
});

});

zip.folder("data")
.file(`${id}.json`,
JSON.stringify(json,null,2));

zip.file("ADD_TO_NOVELS_JSON.txt",
`{
"id":"${id}",
"title":"${title}",
"author":"${author}",
"cover":"${cover}",
"chapters":${chapters.length},
"status":"Ongoing",
"genre":"${genre}"
}`);

const blob=await zip.generateAsync({type:"blob"});

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=`${id}.zip`;
a.click();

}

function titleInput(id){
return document.getElementById(id).value.trim();
}

document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  const text = await file.text();
  document.getElementById("text").value = text;
});

async function uploadFile(token, repo, path, content) {
  const url = `https://api.github.com/repos/${repo}/contents/${path}`;

  let sha = null;

  const old = await fetch(url, {
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json"
    }
  });

  if (old.ok) {
    sha = (await old.json()).sha;
  }

  await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json"
    },
    body: JSON.stringify({
      message: `Upload ${path}`,
      content: btoa(unescape(encodeURIComponent(content))),
      sha
    })
  });
}

async function publish() {
  const token = document.getElementById("token").value.trim();
  const repo = document.getElementById("repo").value.trim();

  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  const genre = document.getElementById("genre").value.trim();
  const cover = document.getElementById("cover").value.trim();

  const id = title.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  const raw = document.getElementById("text").value;

  const chapters = raw
    .split(/(?=Chapter\s+\d+)/i)
    .filter(x => x.trim());

  const json = {
    title,
    author,
    cover,
    description: "",
    chapters: []
  };

  for (let i = 0; i < chapters.length; i++) {
    const file = `chapters/${id}/ch${i+1}.txt`;

    await uploadFile(token, repo, file, chapters[i]);

    json.chapters.push({
  title: `Chapter ${i+1}`,
  file: `chapters/${id}/ch${i+1}.txt`
});
  }

  await uploadFile(
  token,
  repo,
  `data/${id}.json`,
  JSON.stringify(json, null, 2)
);

// Download current novels.json
const res = await fetch("data/novels.json");
const novels = await res.json();

// Add new novel
novels.push({
  id,
  title,
  author,
  cover,
  chapters: chapters.length,
  status: "Ongoing",
  genre
});

// Upload updated novels.json
await uploadFile(
  token,
  repo,
  "data/novels.json",
  JSON.stringify(novels, null, 2)
);

alert("Novel published successfully!");
}

</script>

</body>
</html>
