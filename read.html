<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:#eef2f1;
  color:#2f2f2f;
}
header{
  background:#00897b;
  padding:18px;
  position:sticky;
  top:0;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:32px;
  font-weight:600;
}
.container{
  max-width:760px;
  margin:auto;
  padding:18px;
}
.title{
  text-align:center;
  color:#00897b;
  font-size:28px;
  font-weight:700;
  text-transform:uppercase;
}
.subtitle{
  text-align:center;
  color:#666;
  font-size:20px;
  margin:10px 0 25px;
}
.reader{
  background:#fff;
  border-radius:20px;
  padding:26px;
  font-size:19px;
  line-height:1.95;
  white-space:pre-wrap;
}
.nav{
  display:flex;
  gap:12px;
  margin-top:20px;
}
.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  background:#00897b;
  color:#fff;
  padding:15px;
  border-radius:10px;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div id="bookTitle" class="title">Loading...</div>
<div id="chapterTitle" class="subtitle"></div>

<div id="content" class="reader">Loading...</div>

<div class="nav">
<a id="prev">◀ Previous</a>
<a id="next">Next ▶</a>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||1);

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());
const chapter=await fetch(`chapters/${id}/v${ch}.json`).then(r=>r.json());

bookTitle.textContent=book.title;
chapterTitle.textContent=chapter.title;

let text=chapter.text;

// ---------- REAL STORY START ----------
const prologues=[...text.matchAll(/(^|\n)Prologue:/gm)];

if(prologues.length>=2){
  text=text.slice(prologues[1].index);
}else if(prologues.length===1){
  text=text.slice(prologues[0].index);
}else{
  const c1=text.match(/(^|\n)Chapter\s*1:/m);
  if(c1) text=text.slice(c1.index);
}

// Remove leftover front matter
text=text
.replace(/^Table of Contents[\s\S]*?(?=Prologue:|Chapter\s*1:)/i,"")
.replace(/^Cover$/gim,"")
.replace(/^Color Illustrations$/gim,"")
.replace(/\n{3,}/g,"\n\n")
.trim();
// --------------------------------------

content.textContent=text;

if(ch>1){
prev.href=`read.html?id=${id}&ch=${ch-1}`;
}else{
prev.style.visibility="hidden";
}

if(ch<book.chapters.length){
next.href=`read.html?id=${id}&ch=${ch+1}`;
}else{
next.style.visibility="hidden";
}
}

load().catch(e=>{
content.textContent=e.message;
});
</script>

</body>
</html>
