<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e6eceb;font-family:Poppins,sans-serif;color:#222}
header{background:#00897b;padding:18px;position:sticky;top:0;z-index:100}
.logo{height:52px}
.container{max-width:760px;margin:auto;padding:18px}
h1{text-align:center;color:#00897b;font-size:28px;font-weight:700;margin:16px 0 6px}
.subtitle{text-align:center;color:#666;font-size:20px;margin-bottom:22px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
select{padding:13px;border:none;border-radius:12px;background:#00897b;color:#fff;font:16px Poppins}
.reader{background:#fff;border-radius:22px;padding:26px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
#chapterTitle{font-size:28px;font-weight:700;line-height:1.35;margin-bottom:18px}
#content{font-size:18px;line-height:2;white-space:pre-wrap}
.nav{display:flex;gap:12px;margin-top:26px}
button{flex:1;padding:15px;border:none;border-radius:12px;background:#00897b;color:#fff;font:600 17px Poppins}
button:disabled{opacity:.45}
</style>
</head>
<body>

<header>
<a href="index.html"><img src="assets/logo.png" class="logo"></a>
</header>

<div class="container">

<h1>[New Life+] Young Again in Another World</h1>
<div class="subtitle" id="volumeTitle"></div>

<div class="controls">
<select id="chapterSelect"></select>

<select id="fontSelect">
<option>Poppins</option>
<option>Georgia</option>
<option>Arial</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
<option>28</option>
</select>
</div>

<div class="reader">

<div id="chapterTitle">Loading...</div>
<div id="content">Loading...</div>

<div class="nav">
<button id="prev">◀ Previous</button>
<button id="next">Next ▶</button>
</div>

</div>
</div>

<script>

const volume=Number(new URLSearchParams(location.search).get("ch")||0);

document.getElementById("volumeTitle").textContent="Volume "+(volume+1);

const files=[
"texts/new-life-young-again-v1.txt",
"texts/new-life-young-again-v2.txt",
"texts/new-life-young-again-v3.txt"
];

const chapterSelect=document.getElementById("chapterSelect");
const title=document.getElementById("chapterTitle");
const content=document.getElementById("content");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

const fontSelect=document.getElementById("fontSelect");
const sizeSelect=document.getElementById("sizeSelect");

fontSelect.value=localStorage.font||"Poppins";
sizeSelect.value=localStorage.size||"18";

function applyStyle(){
content.style.fontFamily=fontSelect.value;
content.style.fontSize=sizeSelect.value+"px";
localStorage.font=fontSelect.value;
localStorage.size=sizeSelect.value;
}

fontSelect.onchange=applyStyle;
sizeSelect.onchange=applyStyle;

let chapters=[];
let current=0;

async function load(){

let text=await fetch(files[volume]).then(r=>r.text());

text=text.replace(/\r/g,"");

/* REMOVE EVERYTHING BEFORE REAL PROLOGUE */
const start=text.search(/Prologue:/i);
if(start>0) text=text.slice(start);

/* REMOVE AFTERWORD + COPYRIGHT */
text=text.replace(/Afterword[\s\S]*/i,"");

/* SPLIT INTO REAL CHAPTERS ONLY */
const rx=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm;

const m=[...text.matchAll(rx)];

chapters=[];

let num=1;

for(let i=0;i<m.length;i++){

const s=m[i].index;
const e=i+1<m.length?m[i+1].index:text.length;

let heading=m[i][0];

if(/^Prologue:/i.test(heading))
heading="Chapter 1";

else if(/^Chapter/i.test(heading)){
heading=heading.replace(/^Chapter\s+\d+/i,"Chapter "+(++num));
}

else if(/^Interlude/i.test(heading))
heading="Interlude";

chapters.push({
title:heading,
body:text.slice(s+m[i][0].length,e).trim()
});

}

chapterSelect.innerHTML="";

chapters.forEach((c,i)=>{

chapterSelect.innerHTML+=`<option value="${i}">${c.title}</option>`;

});

show();

}

function show(){

title.textContent=chapters[current].title;
content.textContent=chapters[current].body;

chapterSelect.value=current;

prev.disabled=current===0;
next.disabled=current===chapters.length-1;

scrollTo(0,0);

applyStyle();

}

chapterSelect.onchange=()=>{
current=+chapterSelect.value;
show();
};

prev.onclick=()=>{
if(current){
current--;
show();
}
};

next.onclick=()=>{
if(current<chapters.length-1){
current++;
show();
}
};

load();

</script>

</body>
</html>
