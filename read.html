<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:#d9dddd;
color:#222;
}

header{
background:#00897B;
padding:18px;
position:sticky;
top:0;
z-index:50;
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:#fff;
font-size:26px;
font-weight:700;
}

.brand img{
width:46px;
height:46px;
object-fit:contain;
}

.page{
max-width:760px;
margin:auto;
padding:28px 18px;
}

h1{
font-size:34px;
font-weight:800;
text-align:center;
color:#00897B;
margin-top:10px;
}

.volumeBtn{
display:block;
margin:18px auto 26px;
background:none;
border:none;
font-size:34px;
font-family:Poppins,sans-serif;
color:#666;
cursor:pointer;
}

.controls{
display:grid;
grid-template-columns:2fr 1fr 90px;
gap:10px;
margin-bottom:18px;
}

select{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#00897B;
color:#fff;
font-family:Poppins,sans-serif;
font-size:18px;
outline:none;
}

.reader{
background:#fff;
border-radius:28px;
padding:28px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

#chapterTitle{
font-size:30px;
font-weight:800;
margin-bottom:22px;
}

#content{
max-width:560px;
margin:auto;
font-size:18px;
line-height:2;
white-space:pre-wrap;
word-break:break-word;
text-align:left;
}

.nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:28px;
}

.nav button{
padding:18px;
border:none;
border-radius:16px;
background:#00897B;
color:#fff;
font-family:Poppins,sans-serif;
font-size:20px;
font-weight:700;
cursor:pointer;
}

.nav button:disabled{
background:#9fd4ce;
cursor:not-allowed;
}
</style>
</head>
<body>

<header>
<a href="index.html" class="brand">
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/29/29302.png'">
<span>FreeNovel</span>
</a>
</header>

<div class="page">

<h1>[New Life+] Young Again in Another World</h1>

<button id="volumeBtn" class="volumeBtn">Volume 1 ▼</button>

<div class="controls">

<select id="chapterSelect"></select>

<select id="fontSelect">
<option>Poppins</option>
<option>Georgia</option>
<option>Arial</option>
<option>Verdana</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
</select>

</div>

<div class="reader">

<h2 id="chapterTitle"></h2>

<div id="content"></div>

<div class="nav">
<button id="prev">◀ Previous</button>
<button id="next">Next ▶</button>
</div>

</div>

</div>

<script>

const files=[
'texts/new-life-young-again-v1.txt',
'texts/new-life-young-again-v2.txt',
'texts/new-life-young-again-v3.txt'
];

const params=new URLSearchParams(location.search);

let volume=Number(params.get('ch'))||0;
let current=0;
let chapters=[];

const volumeBtn=document.getElementById('volumeBtn');
const chapterSelect=document.getElementById('chapterSelect');
const chapterTitle=document.getElementById('chapterTitle');
const content=document.getElementById('content');
const fontSelect=document.getElementById('fontSelect');
const sizeSelect=document.getElementById('sizeSelect');
const prev=document.getElementById('prev');
const next=document.getElementById('next');

fontSelect.onchange=()=>{
content.style.fontFamily=fontSelect.value;
};

sizeSelect.onchange=()=>{
content.style.fontSize=sizeSelect.value+'px';
};

volumeBtn.onclick=()=>{
volume=(volume+1)%3;
history.replaceState({},'',`read.html?ch=${volume}`);
loadVolume();
};

async function loadVolume(){

volumeBtn.textContent=`Volume ${volume+1} ▼`;

let text=await fetch(files[volume]).then(r=>r.text());

text=text.replace(/\r/g,'');

if(volume===0){

const p=[...text.matchAll(/^Prologue:/gm)];

if(p.length>=2) text=text.slice(p[1].index);

}

else if(volume===1){

const p=[...text.matchAll(/^Prologue:/gm)];

if(p.length>=2)
text=text.slice(p[1].index);
else if(p.length===1)
text=text.slice(p[0].index);

}

else{

const s=text.search(/^(Prologue:|Chapter\s+\d+:|Interlude:)/m);

if(s!==-1)
text=text.slice(s);

}

const after=text.search(/^Afterword/m);

if(after!==-1)
text=text.slice(0,after);

chapters=[];

const rx=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*|Epilogue:.*)$/gm;

const heads=[...text.matchAll(rx)];

for(let i=0;i<heads.length;i++){

const start=heads[i].index;

const end=i+1<heads.length?heads[i+1].index:text.length;

let title=heads[i][0];

if(title.startsWith('Prologue'))
title='Chapter 1';

let body=text.slice(start+heads[i][0].length,end).trim();

body=body.replace(/^Was Told\s*/,'');
body=body.replace(/^Told\s*/,'');

chapters.push({title,body});

}

if(!chapters.length){

chapters=[{title:'Chapter 1',body:text.trim()}];

}

chapterSelect.innerHTML='';

chapters.forEach((c,i)=>{

chapterSelect.innerHTML+=`<option value="${i}">${c.title}</option>`;

});

current=0;

show();

}

function show(){

chapterSelect.value=current;

chapterTitle.textContent=chapters[current].title;

content.textContent=chapters[current].body;

prev.disabled=current===0;

next.disabled=current===chapters.length-1;

window.scrollTo({top:0,behavior:'smooth'});

}

chapterSelect.onchange=()=>{

current=Number(chapterSelect.value);

show();

};

prev.onclick=()=>{

if(current>0){

current--;

show();

}

};

next.onclick=()=>{

if(current<chapters.length-1){

current++;

show();

}

};

loadVolume();

</script>

</body>
</html>
