<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{margin:0;background:#eef2f2;font-family:Arial}
header{background:#00897b;color:#fff;padding:20px;font-size:32px}
.container{padding:15px}
canvas{
width:100%;
height:auto;
border-radius:15px;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.15)
}
.pages{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
margin:15px 0;
}
.pages button{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:#00897b;
color:white;
font-size:18px;
}
.pages button.active{background:#004d40}
.back{
display:block;
text-align:center;
margin-top:20px;
padding:15px;
background:#00897b;
color:white;
text-decoration:none;
border-radius:999px;
font-size:22px;
}
</style>
</head>

<body>

<header>FreeNovel</header>

<div class="container">

<canvas id="pdf"></canvas>

<div id="buttons" class="pages"></div>

<a class="back" href="index.html">← Back Home</a>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=params.get("ch")||1;

const pdfFile=`pdfs/${id}-v${ch}.pdf`;

let pdfDoc;
let current=1;
const canvas=document.getElementById("pdf");
const ctx=canvas.getContext("2d");

async function render(pageNum){
const page=await pdfDoc.getPage(pageNum);
const viewport=page.getViewport({scale:1.5});

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport}).promise;

document.querySelectorAll(".pages button").forEach((b,i)=>{
b.classList.toggle("active",i+1===pageNum);
});
}

pdfjsLib.getDocument(pdfFile).promise.then(pdf=>{
pdfDoc=pdf;

const wrap=document.getElementById("buttons");

for(let i=1;i<=pdf.numPages;i++){
const btn=document.createElement("button");
btn.textContent=i;
btn.onclick=()=>{
current=i;
render(i);
};
wrap.appendChild(btn);
}

render(1);

}).catch(()=>{
document.body.innerHTML=`
<header>FreeNovel</header>
<div style="padding:20px;text-align:center">
<h2>PDF not found</h2>
<p>${pdfFile}</p>
<a href="index.html">Back Home</a>
</div>`;
});
</script>

</body>
</html>
