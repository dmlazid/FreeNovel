<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#eef2f1;
    font-family:'Poppins',sans-serif;
    color:#333;
}

header{
    background:#00897b;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
}

header a{
    color:#fff;
    text-decoration:none;
    font-size:32px;
    font-weight:600;
}

.container{
    max-width:760px;
    margin:auto;
    padding:18px;
}

.title{
    color:#00897b;
    text-align:center;
    font-size:28px;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.3;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:20px;
    margin:12px 0 24px;
}

.reader{
    background:#fff;
    border-radius:18px;
    padding:28px;
    font-size:20px;
    line-height:2;
    white-space:pre-wrap;
    word-break:break-word;
}

.nav{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.nav a{
    flex:1;
    background:#00897b;
    color:#fff;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
}

@media(max-width:600px){
.reader{
font-size:18px;
padding:22px;
line-height:1.9;
}
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div id="bookTitle" class="title">Loading...</div>
<div id="chapterTitle" class="subtitle"></div>

<div id="content" class="reader">Loading...</div>

<div class="nav">
<a id="prev">◀ Previous</a>
<a id="next">Next ▶</a>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||1);

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());
const chapter=await fetch(`chapters/${id}/v${ch}.json`).then(r=>r.json());

bookTitle.textContent=book.title;
chapterTitle.textContent=chapter.title;

let text=chapter.text;

// Remove TOC, Cover, and Color Illustrations
text=text
.replace(/Table of Contents[\s\S]*?(?=Prologue:|Chapter\s*1:)/i,"")
.replace(/^Cover\s*$/gim,"")
.replace(/^Color Illustrations\s*$/gim,"");

// If two Prologues exist, start from the second one
const matches=[...text.matchAll(/Prologue:/gi)];
if(matches.length>=2){
text=text.slice(matches[1].index);
}else if(matches.length===1){
text=text.slice(matches[0].index);
}else{
const c1=text.search(/Chapter\s*1:/i);
if(c1!==-1) text=text.slice(c1);
}

// Remove duplicate blank lines
text=text.replace(/\n{3,}/g,"\n\n").trim();

content.textContent=text;

if(ch>1){
prev.href=`read.html?id=${id}&ch=${ch-1}`;
}else{
prev.style.visibility="hidden";
}

if(ch<book.chapters.length){
next.href=`read.html?id=${id}&ch=${ch+1}`;
}else{
next.style.visibility="hidden";
}

}

load().catch(err=>{
content.textContent="Error: "+err.message;
});
</script>

</body>
</html>
