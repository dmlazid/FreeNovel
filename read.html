<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
body{
  margin:0;
  background:#dfe5e5;
  font-family:Arial,sans-serif;
}
header{
  background:#00897b;
  padding:18px;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:42px;
}
.card{
  background:#fff;
  margin:20px;
  border-radius:28px;
  padding:20px;
}
h2{
  text-align:center;
}
#viewer{
  width:100%;
  height:80vh;
  border:none;
  border-radius:16px;
  background:#fff;
}
.topnav{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
.btn{
  background:#00897b;
  color:#fff;
  padding:12px 22px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>
<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="card">

<div class="topnav">
<a id="prev" class="btn">◀ Prev Volume</a>
<a id="next" class="btn">Next Volume ▶</a>
</div>

<h2 id="title">Loading...</h2>

<iframe id="viewer"></iframe>

</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
let ch=parseInt(params.get("ch")||1);

fetch(`data/${id}.json`)
.then(r=>r.json())
.then(book=>{

const total=book.chapters.length;
const current=book.chapters[ch-1];

document.getElementById("title").textContent=
`${book.title} — ${current.title}`;

document.getElementById("viewer").src=current.pdf+"#toolbar=0&navpanes=0";

const prev=document.getElementById("prev");
const next=document.getElementById("next");

if(ch>1){
  prev.href=`read.html?id=${id}&ch=${ch-1}`;
}else{
  prev.style.visibility="hidden";
}

if(ch<total){
  next.href=`read.html?id=${id}&ch=${ch+1}`;
}else{
  next.style.visibility="hidden";
}

})
.catch(()=>{
document.querySelector(".card").innerHTML="<h2>Reader failed to load.</h2>";
});
</script>

</body>
</html>
