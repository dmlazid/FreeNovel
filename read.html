<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#eef2f1;
 font-family:Poppins,sans-serif;
 color:#333;
}
header{
 background:#00897b;
 padding:18px;
 position:sticky;
 top:0;
 z-index:100;
}
.logo{
 height:55px;
}
.container{
 max-width:760px;
 margin:auto;
 padding:22px 18px;
}
.title{
 text-align:center;
 color:#00897b;
 font-size:34px;
 font-weight:700;
 margin-bottom:8px;
}
.subtitle{
 text-align:center;
 font-size:24px;
 color:#666;
 margin-bottom:18px;
}
.controls{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:10px;
 margin-bottom:18px;
}
select{
 width:100%;
 padding:14px;
 border:none;
 border-radius:10px;
 background:#00897b;
 color:white;
 font:16px Poppins;
}
.reader{
 background:white;
 border-radius:24px;
 padding:24px;
}
#chapterTitle{
 font-size:32px;
 font-weight:700;
 margin-bottom:18px;
}
#content{
 max-width:620px;
 margin:auto;
 line-height:2;
 font-size:18px;
}
#content p{
 margin-bottom:22px;
}
.nav{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 gap:10px;
 align-items:center;
 margin-top:28px;
}
.nav button{
 background:#00897b;
 color:white;
 border:none;
 border-radius:12px;
 padding:14px;
 font:600 17px Poppins;
}
.nav button:disabled{
 opacity:.45;
}
#pageInfo{
 font-weight:600;
}
#topBtn{
 position:fixed;
 right:18px;
 bottom:18px;
 width:52px;
 height:52px;
 border:none;
 border-radius:50%;
 background:#d8b04b;
 color:white;
 font-size:24px;
 display:none;
}
</style>
</head>

<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo" onerror="this.src='assets/logo.svg'">
</a>
</header>

<div class="container">

<div class="title">[New Life+] Young Again in Another World</div>
<div class="subtitle" id="volLabel"></div>

<div class="controls">

<select id="volumeSelect">
<option value="0">Volume 1</option>
<option value="1">Volume 2</option>
<option value="2">Volume 3</option>
</select>

<select id="chapterSelect"></select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
</select>

</div>

<div class="reader">

<h2 id="chapterTitle">Loading...</h2>

<div id="content">Loading...</div>

<div class="nav">
<button id="prev">◀ Previous</button>
<div id="pageInfo"></div>
<button id="next">Next ▶</button>
</div>

</div>

</div>

<button id="topBtn">↑</button>

<script>
const files=[
 "texts/new-life-young-again-v1.txt",
 "texts/new-life-young-again-v2.txt",
 "texts/new-life-young-again-v3.txt"
];

let volume=Number(new URLSearchParams(location.search).get("ch")||0);
let chapters=[];
let current=0;

const volumeSelect=document.getElementById("volumeSelect");
const chapterSelect=document.getElementById("chapterSelect");
const chapterTitle=document.getElementById("chapterTitle");
const content=document.getElementById("content");
const pageInfo=document.getElementById("pageInfo");
const sizeSelect=document.getElementById("sizeSelect");

volumeSelect.value=volume;

async function loadVolume(){

 document.getElementById("volLabel").textContent="Volume "+(volume+1);

 let text=await fetch(files[volume]).then(r=>r.text());

 text=text.replace(/\r/g,"");

 // Remove TOC
 const pros=[...text.matchAll(/^Prologue:/gm)];
 if(pros.length>=2){
   text=text.slice(pros[1].index);
 }

 // Remove Afterword
 const after=text.search(/^Afterword/m);
 if(after!=-1) text=text.slice(0,after);

 chapters=[];

 const rx=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm;
 const heads=[...text.matchAll(rx)];

 for(let i=0;i<heads.length;i++){

   const start=heads[i].index;
   const end=i+1<heads.length?heads[i+1].index:text.length;

   let name=heads[i][0];

   if(name.startsWith("Prologue"))
      name="Chapter 1";

   chapters.push({
      title:name,
      body:text.slice(start+heads[i][0].length,end).trim()
   });
 }

 chapterSelect.innerHTML="";

 chapters.forEach((c,i)=>{
   chapterSelect.innerHTML+=`<option value="${i}">${c.title}</option>`;
 });

 current=0;
 show();
}

function show(){

 chapterTitle.textContent=chapters[current].title;

 content.innerHTML=chapters[current].body
   .split(/\n\s*\n/)
   .map(p=>`<p>${p}</p>`)
   .join("");

 chapterSelect.value=current;

 pageInfo.textContent=(current+1)+" / "+chapters.length;

 document.getElementById("prev").disabled=current==0;
 document.getElementById("next").disabled=current==chapters.length-1;

 content.style.fontSize=sizeSelect.value+"px";

 window.scrollTo({top:0,behavior:"smooth"});
}

volumeSelect.onchange=()=>{
 volume=+volumeSelect.value;
 history.replaceState({},'',`read.html?ch=${volume}`);
 loadVolume();
};

chapterSelect.onchange=()=>{
 current=+chapterSelect.value;
 show();
};

document.getElementById("prev").onclick=()=>{
 if(current>0){
   current--;
   show();
 }
};

document.getElementById("next").onclick=()=>{
 if(current<chapters.length-1){
   current++;
   show();
 }
};

sizeSelect.onchange=()=>show();

const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",()=>{
 topBtn.style.display=window.scrollY>500?"block":"none";
});

topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

loadVolume();
</script>

</body>
</html>
