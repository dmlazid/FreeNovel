<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#dfe5e5;
  font-family:Arial,sans-serif;
}
header{
  background:#00897b;
  padding:18px;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:42px;
}
.card{
  background:#fff;
  margin:20px;
  border-radius:28px;
  padding:20px;
}
h1{text-align:center}

#page{
  width:100%;
  display:block;
  border-radius:12px;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  gap:10px;
}
.btn{
  background:#00897b;
  color:#fff;
  text-decoration:none;
  border:none;
  padding:16px 28px;
  border-radius:30px;
  font-size:20px;
  cursor:pointer;
}
#counter{
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="card">

<h1 id="title">Loading...</h1>

<canvas id="page"></canvas>

<div class="nav">
<button id="prev" class="btn">◀ Prev</button>
<div id="counter">Page 1/1</div>
<button id="next" class="btn">Next ▶</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||1);

let pdf,pageNum=1;

async function load(){

 const book=await fetch(`data/${id}.json`).then(r=>r.json());
 const volume=book.chapters[ch-1];

 document.getElementById("title").textContent=
 `${book.title} — ${volume.title}`;

 pdf=await pdfjsLib.getDocument(volume.pdf).promise;

 render();

}

async function render(){

 const page=await pdf.getPage(pageNum);

 const canvas=document.getElementById("page");
 const ctx=canvas.getContext("2d");

 const viewport=page.getViewport({scale:2});

 canvas.width=viewport.width;
 canvas.height=viewport.height;

 await page.render({
   canvasContext:ctx,
   viewport
 }).promise;

 document.getElementById("counter").textContent=
 `Page ${pageNum}/${pdf.numPages}`;

}

prev.onclick=()=>{
 if(pageNum>1){
   pageNum--;
   render();
 }
};

next.onclick=()=>{
 if(pageNum<pdf.numPages){
   pageNum++;
   render();
 }else{
   location.href=`read.html?id=${id}&ch=${ch+1}`;
 }
};

load().catch(e=>{
 document.querySelector(".card").innerHTML=
 `<h2>Error</h2><p>${e.message}</p>`;
});
</script>

</body>
</html>
