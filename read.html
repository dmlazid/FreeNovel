<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#e7eceb;
font-family:Poppins,sans-serif;
color:#222;
}
header{
background:#00897b;
padding:18px;
position:sticky;
top:0;
z-index:100;
}
.logo{height:52px}
.container{
max-width:760px;
margin:auto;
padding:18px;
}
h1{
text-align:center;
color:#00897b;
font-size:28px;
font-weight:700;
margin:18px 0 6px;
}
.subtitle{
text-align:center;
color:#666;
font-size:20px;
margin-bottom:22px;
}
.controls{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-bottom:18px;
}
select{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:#00897b;
color:white;
font:16px Poppins;
}
.reader{
background:white;
border-radius:22px;
padding:26px;
box-shadow:0 6px 16px rgba(0,0,0,.08);
}
#chapterTitle{
font-size:28px;
font-weight:700;
line-height:1.35;
margin-bottom:18px;
}
#content{
font-size:18px;
line-height:2;
white-space:pre-wrap;
}
.nav{
display:flex;
gap:12px;
margin-top:28px;
}
button{
flex:1;
padding:15px;
border:none;
border-radius:12px;
background:#00897b;
color:white;
font:600 17px Poppins;
}
button:disabled{opacity:.45}
.loading{
text-align:center;
color:#666;
padding:30px;
}
</style>
</head>
<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo">
</a>
</header>

<div class="container">

<h1>[New Life+] Young Again in Another World</h1>
<div class="subtitle" id="volumeTitle">Volume 1</div>

<div class="controls">

<select id="volumeSelect">
<option value="0">Volume 1</option>
<option value="1">Volume 2</option>
<option value="2">Volume 3</option>
</select>

<select id="fontSelect">
<option>Poppins</option>
<option>Georgia</option>
<option>Arial</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
<option>28</option>
</select>

</div>

<div class="reader">

<div id="chapterTitle">Loading...</div>

<div id="content" class="loading">
Loading chapter...
</div>

<div class="nav">
<button id="prev">◀ Previous</button>
<button id="next">Next ▶</button>
</div>

</div>

</div>

<script>

const volumeSelect=document.getElementById("volumeSelect");
const fontSelect=document.getElementById("fontSelect");
const sizeSelect=document.getElementById("sizeSelect");

fontSelect.value=localStorage.font||"Poppins";
sizeSelect.value=localStorage.size||"18";

function applyStyle(){
content.style.fontFamily=fontSelect.value;
content.style.fontSize=sizeSelect.value+"px";
localStorage.font=fontSelect.value;
localStorage.size=sizeSelect.value;
}
fontSelect.onchange=applyStyle;
sizeSelect.onchange=applyStyle;

const params=new URLSearchParams(location.search);

let volume=Number(params.get("ch")||0);

volumeSelect.value=volume;

const files=[
"texts/new-life-young-again-v1.txt",
"texts/new-life-young-again-v2.txt",
"texts/new-life-young-again-v3.txt"
];

let chapters=[];
let current=0;

const title=document.getElementById("chapterTitle");
const content=document.getElementById("content");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

function show(){

document.getElementById("volumeTitle").textContent="Volume "+(volume+1);

title.textContent=chapters[current].title;

content.classList.remove("loading");
content.textContent=chapters[current].body;

prev.disabled=current===0;
next.disabled=current===chapters.length-1;

scrollTo(0,0);

applyStyle();

}

async function loadVolume(){

title.textContent="Loading...";
content.textContent="Loading chapter...";

const text=await fetch(files[volume]).then(r=>r.text());

let t=text.replace(/\r/g,"");

t=t.replace(/Table of Contents[\s\S]*?(?=Prologue:|Chapter 1:)/i,"");

const rx=/^(Prologue:.*|Chapter \d+:.*|Interlude:.*|Epilogue:.*|Afterword.*)$/gm;

const m=[...t.matchAll(rx)];

chapters=[];

for(let i=0;i<m.length;i++){

const start=m[i].index;

const end=i+1<m.length?m[i+1].index:t.length;

chapters.push({
title:m[i][0],
body:t.slice(start+m[i][0].length,end).trim()
});

}

current=0;

show();

}

volumeSelect.onchange=()=>{

volume=Number(volumeSelect.value);

history.replaceState({},'',`?ch=${volume}`);

loadVolume();

};

prev.onclick=()=>{

if(current>0){
current--;
show();
}

};

next.onclick=()=>{

if(current<chapters.length-1){
current++;
show();
}

};

loadVolume();

</script>

</body>
</html>
