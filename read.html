<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eef2f2;
  color:#333;
  font-family:Georgia,serif;
}
header{
  background:#00897b;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:42px;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.title{
  color:#00897b;
  text-align:center;
  font-size:42px;
  font-weight:bold;
  text-transform:uppercase;
}
.chapter{
  text-align:center;
  font-size:28px;
  color:#555;
  margin:15px 0 25px;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}
.btn{
  background:#00897b;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:6px;
  text-decoration:none;
  text-align:center;
  font-size:20px;
  cursor:pointer;
}
#content{
  background:#fff;
  border-radius:16px;
  padding:30px;
  font-size:24px;
  line-height:2;
  white-space:pre-wrap;
}
.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:30px 0;
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div class="title" id="bookTitle">Loading...</div>
<div class="chapter" id="chapterTitle">Loading...</div>

<div class="controls">
<button class="btn" id="smaller">A−</button>
<button class="btn" id="theme">☀</button>
<button class="btn" id="bigger">A+</button>
</div>

<div id="content">Loading chapter...</div>

<div class="bottom">
<a class="btn" id="prev">◀ Previous</a>
<a class="btn" id="next">Next ▶</a>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const q=new URLSearchParams(location.search);
const id=q.get("id");
const ch=parseInt(q.get("ch")||1);

const content=document.getElementById("content");
let font=24;

smaller.onclick=()=>{font=Math.max(16,font-2);content.style.fontSize=font+"px";}
bigger.onclick=()=>{font+=2;content.style.fontSize=font+"px";}

let dark=false;
theme.onclick=()=>{
dark=!dark;
document.body.style.background=dark?"#121212":"#eef2f2";
content.style.background=dark?"#1d1d1d":"white";
content.style.color=dark?"#eee":"#333";
};

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());
const volume=book.chapters[ch-1];

bookTitle.textContent=book.title.toUpperCase();
chapterTitle.textContent=volume.title;

const pdf=await pdfjsLib.getDocument(volume.pdf).promise;

let txt="";

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);
const t=await page.getTextContent();

let lastY=null;

for(const item of t.items){

const y=item.transform[5];

if(lastY!==null && Math.abs(y-lastY)>8)
txt+="\n";

txt+=item.str+" ";
lastY=y;

}

txt+="\n\n";

}

content.textContent=txt.trim();

if(ch>1)
prev.href=`read.html?id=${id}&ch=${ch-1}`;
else
prev.style.visibility="hidden";

if(ch<book.chapters.length)
next.href=`read.html?id=${id}&ch=${ch+1}`;
else
next.style.visibility="hidden";

}

load().catch(e=>{
content.textContent=e.message;
});
</script>

</body>
</html>
