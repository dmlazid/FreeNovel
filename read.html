<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeNovel Reader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f3;
}
header{
  background:#00897b;
  padding:15px;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:32px;
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:42px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:25px;
  padding:20px;
}

.cover{
  width:220px;
  border-radius:16px;
  display:block;
  margin:auto;
}

h1{
  text-align:center;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

.buttons button{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:#00897b;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.buttons button.active{
  background:#00695c;
}

#viewer{
  width:100%;
  height:90vh;
  border:none;
  border-radius:16px;
  background:#ddd;
}
</style>
</head>

<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo">
FreeNovel
</a>
</header>

<div class="container">
<div class="card">

<img id="cover" class="cover">

<h1 id="title"></h1>

<div id="volumes" class="buttons"></div>

<iframe id="viewer"></iframe>

</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const current = Number(params.get("ch") || 0);

async function load(){

const data = await fetch(`data/${id}.json`).then(r=>r.json());

document.getElementById("cover").src = data.cover;
document.getElementById("title").innerText = data.title;

const holder = document.getElementById("volumes");
holder.innerHTML="";

data.chapters.forEach((v,i)=>{

const btn=document.createElement("button");
btn.textContent=i+1;

if(i===current) btn.classList.add("active");

btn.onclick=()=>{
location.href=`read.html?id=${id}&ch=${i}`;
};

holder.appendChild(btn);

});

document.getElementById("viewer").src =
data.chapters[current].pdf + "#toolbar=0&navpanes=0&scrollbar=1";

}

load().catch(()=>{
document.querySelector(".card").innerHTML=`
<h2>Novel not found</h2>
<a href="index.html" style="
display:block;
margin-top:20px;
padding:16px;
background:#00897b;
color:white;
text-align:center;
text-decoration:none;
border-radius:30px;">← Back Home</a>`;
});
</script>

</body>
</html>
