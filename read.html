<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f3f3f3;color:#333;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#00897b;padding:18px;position:sticky;top:0}
header a{color:#fff;text-decoration:none;font-size:34px;font-weight:600}
.container{max-width:760px;margin:auto;padding:20px}
.book{color:#00897b;text-align:center;font-size:24px;font-weight:700;text-transform:uppercase}
.chapter{text-align:center;color:#666;font-size:19px;margin:12px 0 24px}
#content{
background:#fff;
border-radius:12px;
padding:28px;
font-size:18px;
line-height:2;
white-space:pre-wrap;
}
.nav{
display:flex;
gap:12px;
margin-top:28px;
}
.nav a{
flex:1;
text-align:center;
background:#00897b;
color:#fff;
padding:16px;
border-radius:6px;
text-decoration:none;
font-weight:600;
}
</style>
</head>
<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div class="book" id="book"></div>
<div class="chapter" id="chapter"></div>

<div id="content">Loading...</div>

<div class="nav">
<a id="prev">◀ Previous</a>
<a id="next">Next ▶</a>
</div>

</div>

<script>
const q=new URLSearchParams(location.search);
const id=q.get("id");
const ch=parseInt(q.get("ch")||1);

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());

const chapter=await fetch(`chapters/${id}/v${ch}.json`).then(r=>r.json());

document.getElementById("book").textContent=book.title.toUpperCase();
document.getElementById("chapter").textContent=chapter.title;
document.getElementById("content").textContent=chapter.text;

if(ch>1)
prev.href=`read.html?id=${id}&ch=${ch-1}`;
else
prev.style.visibility="hidden";

if(ch<book.chapters.length)
next.href=`read.html?id=${id}&ch=${ch+1}`;
else
next.style.visibility="hidden";

}

load().catch(e=>{
content.textContent=e.message;
});
</script>

</body>
</html>
