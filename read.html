<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e3e8e7;font-family:Poppins,sans-serif;color:#333}
header{background:#00897b;height:82px;display:flex;align-items:center;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-size:34px;font-weight:500}
.brand img{width:48px;height:48px;object-fit:contain}
.container{max-width:760px;margin:auto;padding:22px 16px}
h1{text-align:center;color:#00897b;font-size:34px;font-weight:700;line-height:1.3;margin:18px 0 10px}
#volumeBtn{display:block;text-align:center;text-decoration:none;color:#666;font-size:30px;margin-bottom:24px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
select{height:60px;border:none;border-radius:12px;background:#00897b;color:#fff;font:500 16px Poppins;padding:0 14px}
.card{background:#fff;border-radius:22px;padding:22px}
#chapterTitle{font-size:32px;font-weight:700;margin-bottom:18px}
#content{max-width:560px;margin:auto;font-size:18px;line-height:2}
#content p{margin-bottom:22px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.nav button{height:60px;border:none;border-radius:12px;background:#00897b;color:#fff;font:600 20px Poppins}
.nav button:disabled{background:#8cc8c0}
#topBtn{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border:none;border-radius:50%;background:#d7b24b;color:#fff;font-size:24px;display:none}
</style>
</head>

<body>

<header>
<a class="brand" href="index.html">
<img src="assets/logo.png"
     onerror="this.onerror=null;this.src='logo.png';this.onerror=function(){this.style.display='none';document.getElementById('logoText').style.display='inline';};">
<span id="logoText" style="display:none;">📚 FreeNovel</span>
</a>
</header>

<div class="container">

<h1>[New Life+] Young Again in Another World</h1>

<a href="#" id="volumeBtn">Volume 1 ▼</a>

<div class="controls">
<select id="chapterSelect"></select>

<select id="fontSelect">
<option selected>Poppins</option>
<option>Georgia</option>
<option>Arial</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
</select>
</div>

<div class="card">
<div id="chapterTitle">Loading...</div>
<div id="content">Loading...</div>

<div class="nav">
<button id="prev">◀ Previous</button>
<button id="next">Next ▶</button>
</div>
</div>

</div>

<button id="topBtn">↑</button>

<script>

const files=[
"texts/new-life-young-again-v1.txt",
"texts/new-life-young-again-v2.txt",
"texts/new-life-young-again-v3.txt"
];

let volume=0,current=0,chapters=[];

const volumeBtn=document.getElementById("volumeBtn");
const chapterSelect=document.getElementById("chapterSelect");
const chapterTitle=document.getElementById("chapterTitle");
const content=document.getElementById("content");
const fontSelect=document.getElementById("fontSelect");
const sizeSelect=document.getElementById("sizeSelect");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

volumeBtn.onclick=e=>{
e.preventDefault();
volume=(volume+1)%3;
volumeBtn.textContent=`Volume ${volume+1} ▼`;
loadVolume();
};

async function loadVolume(){

let text=await fetch(files[volume]).then(r=>r.text());
text=text.replace(/\r/g,'');

/* -------- REMOVE TOC -------- */

if(volume===0){

// V1: use second Prologue
const p=[...text.matchAll(/^Prologue:/gm)];
if(p.length>=2) text=text.slice(p[1].index);

}else if(volume===1){

// V2: find first REAL chapter (not TOC)
const rx=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm;
const heads=[...text.matchAll(rx)];

if(heads.length>1){
const first=heads[0].index;
const second=heads[1].index;

if(second-first<2500){
text=text.slice(second);
}else{
text=text.slice(first);
}
}else if(heads.length){
text=text.slice(heads[0].index);
}

}else{

// V3: first real heading
const start=text.search(/^(Prologue:|Chapter\s+\d+:|Interlude:)/m);
if(start!==-1) text=text.slice(start);

}

/* remove afterword */

const after=text.search(/^Afterword/m);
if(after!==-1) text=text.slice(0,after);

/* -------- SPLIT CHAPTERS -------- */

chapters=[];

const rx=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm;
const heads=[...text.matchAll(rx)];

for(let i=0;i<heads.length;i++){

const start=heads[i].index;
const end=i+1<heads.length?heads[i+1].index:text.length;

let title=heads[i][0];

if(title.startsWith("Prologue")) title="Chapter 1";

chapters.push({
title,
body:text.slice(start+heads[i][0].length,end).trim()
});

}

if(!chapters.length){
chapters=[{title:"Chapter 1",body:text.trim()}];
}

chapterSelect.innerHTML='';
chapters.forEach((c,i)=>{
chapterSelect.innerHTML+=`<option value="${i}">${c.title}</option>`;
});

current=0;
show();
}

function show(){

const ch=chapters[current];

chapterTitle.textContent=ch.title;

content.innerHTML=ch.body
.split(/\n\s*\n/)
.map(p=>`<p>${p}</p>`)
.join('');

chapterSelect.value=current;

content.style.fontFamily=fontSelect.value;
content.style.fontSize=sizeSelect.value+"px";

prev.disabled=current===0;
next.disabled=current===chapters.length-1;

window.scrollTo({top:0,behavior:"smooth"});
}

chapterSelect.onchange=()=>{
current=+chapterSelect.value;
show();
};

fontSelect.onchange=show;
sizeSelect.onchange=show;

prev.onclick=()=>{
if(current>0){
current--;
show();
}
};

next.onclick=()=>{
if(current<chapters.length-1){
current++;
show();
}
};

const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",()=>{
topBtn.style.display=window.scrollY>500?"block":"none";
});

topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

loadVolume();

</script>

</body>
</html>
