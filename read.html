<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f3;
}
header{
  background:#00897b;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}
header a{
  color:white;
  text-decoration:none;
  font-size:30px;
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{width:40px}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
}

.cover{
  width:220px;
  max-width:100%;
  display:block;
  margin:auto;
  border-radius:16px;
}

h1{text-align:center}

#volumes{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:20px 0;
}

#volumes button{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#00897b;
  color:white;
  font-size:18px;
  cursor:pointer;
}

#volumes button.active{
  background:#00695c;
}

#pages canvas{
  width:100% !important;
  height:auto !important;
  display:block;
  margin:14px 0;
  border-radius:12px;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:20px;
}

.back{
  display:block;
  text-align:center;
  background:#00897b;
  color:white;
  text-decoration:none;
  padding:16px;
  border-radius:30px;
  margin-top:20px;
}
</style>
</head>
<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo" onerror="this.style.display='none'">
FreeNovel
</a>
</header>

<div class="container">
<div class="card">

<img id="cover" class="cover">

<h1 id="title">Loading...</h1>

<div id="volumes"></div>

<div id="pages" class="loading">Loading pages...</div>

<a href="index.html" class="back">← Back Home</a>

</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

const params=new URLSearchParams(location.search);
const id=params.get("id");
const current=Number(params.get("ch")||0);

async function load(){

const data=await fetch(`data/${id}.json`).then(r=>r.json());

title.textContent=data.title;
cover.src=data.cover;

const holder=document.getElementById("volumes");

data.chapters.forEach((v,i)=>{

const b=document.createElement("button");
b.textContent=i+1;

if(i===current)b.classList.add("active");

b.onclick=()=>location=`read.html?id=${id}&ch=${i}`;

holder.appendChild(b);

});

renderPDF(data.chapters[current].pdf);

}

async function renderPDF(file){

const pdf=await pdfjsLib.getDocument(file).promise;

const pages=document.getElementById("pages");
pages.innerHTML="";

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);

const viewport=page.getViewport({scale:1.6});

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({
canvasContext:ctx,
viewport
}).promise;

pages.appendChild(canvas);

}

}

load().catch(()=>{
document.querySelector(".card").innerHTML=`
<h2>Novel not found</h2>
<a class="back" href="index.html">← Back Home</a>
`;
});
</script>

</body>
</html>
