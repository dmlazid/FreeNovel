<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#d9dddd;
    font-family:Poppins,sans-serif;
}
header{
    background:#00897B;
    padding:16px;
}
.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    font-size:30px;
    font-weight:700;
}
.logo img{
    width:48px;
    height:48px;
    object-fit:contain;
}
.wrap{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.title{
    text-align:center;
    color:#00897B;
    font-size:34px;
    font-weight:800;
    margin-bottom:8px;
}
#volumeSelect{
    display:block;
    margin:0 auto 20px;
    padding:14px 22px;
    border:none;
    border-radius:14px;
    background:#00897B;
    color:#fff;
    font-size:20px;
    font-family:Poppins,sans-serif;
}
.viewer{
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
}
iframe{
    width:100%;
    height:90vh;
    border:none;
}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">
<img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/29/29302.png'">
<span>FreeNovel</span>
</a>
</header>

<div class="wrap">

<div class="title">[New Life+] Young Again in Another World</div>

<select id="volumeSelect">
    <option value="0">Volume 1</option>
    <option value="1">Volume 2</option>
    <option value="2">Volume 3</option>
</select>

<div class="viewer">
    <iframe id="pdfViewer"></iframe>
</div>

</div>

<script>
const pdfs=[
"pdfs/new-life-young-again-v1.pdf",
"pdfs/new-life-young-again-v2.pdf",
"pdfs/new-life-young-again-v3.pdf"
];

const viewer=document.getElementById("pdfViewer");
const select=document.getElementById("volumeSelect");

const params=new URLSearchParams(location.search);
let volume=Number(params.get("ch"))||0;

select.value=volume;

function loadVolume(v){
    viewer.src=pdfs[v]+"#toolbar=0&navpanes=0&scrollbar=1";
    history.replaceState({},'',`read.html?ch=${v}`);
}

select.onchange=()=>loadVolume(Number(select.value));

loadVolume(volume);
</script>

</body>
</html>
