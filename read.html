<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNovel Reader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eef2f2;
  font-family:Georgia,serif;
  color:#111;
}
header{
  background:#00897b;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}
header a{
  color:#fff;
  text-decoration:none;
  font-size:40px;
}
.container{
  max-width:900px;
  margin:20px auto;
  padding:18px;
}
.card{
  background:#fff;
  border-radius:28px;
  padding:28px;
}
h1{
  text-align:center;
  font-size:34px;
  margin-bottom:25px;
}
#content{
  font-size:22px;
  line-height:1.9;
  white-space:pre-wrap;
}
.nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:35px;
}
.btn{
  background:#00897b;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:16px;
  border-radius:35px;
  flex:1;
  font-size:22px;
  font-weight:bold;
}
.loading{
  text-align:center;
  font-size:24px;
  padding:40px;
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">
<div class="card">

<h1 id="title">Loading...</h1>

<div id="content" class="loading">Extracting text...</div>

<div class="nav">
<a id="prev" class="btn">◀ Previous</a>
<a id="next" class="btn">Next ▶</a>
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||1);

async function load(){

  const book=await fetch(`data/${id}.json`).then(r=>r.json());
  const volume=book.chapters[ch-1];

  document.getElementById("title").textContent=
  `${book.title} — ${volume.title}`;

  const pdf=await pdfjsLib.getDocument(volume.pdf).promise;

  let text="";

  for(let p=1;p<=pdf.numPages;p++){

    const page=await pdf.getPage(p);
    const content=await page.getTextContent();

    let lastY=null;

    content.items.forEach(item=>{

      if(lastY!==null && Math.abs(item.transform[5]-lastY)>8){
        text+="\n";
      }

      text+=item.str+" ";
      lastY=item.transform[5];

    });

    text+="\n\n";
  }

  document.getElementById("content").textContent=text.trim();

  if(ch>1){
    prev.href=`read.html?id=${id}&ch=${ch-1}`;
  }else{
    prev.style.visibility="hidden";
  }

  if(ch<book.chapters.length){
    next.href=`read.html?id=${id}&ch=${ch+1}`;
  }else{
    next.style.visibility="hidden";
  }

}

load().catch(e=>{
document.getElementById("content").textContent=e.message;
});
</script>

</body>
</html>
