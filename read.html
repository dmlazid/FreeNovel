<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#00897b;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}
header a{
  color:white;
  text-decoration:none;
  font-size:36px;
}
#title{
  text-align:center;
  margin:15px;
}
.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 15px;
}
.btn{
  flex:1;
  background:#00897b;
  color:white;
  text-align:center;
  padding:14px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}
#pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding-bottom:30px;
}
canvas{
  width:100%;
  max-width:900px;
  height:auto;
  display:block;
}
.loading{
  text-align:center;
  padding:40px;
  font-size:22px;
}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<h2 id="title">Loading...</h2>

<div class="nav">
<a id="prev" class="btn">◀ Previous Volume</a>
<a id="next" class="btn">Next Volume ▶</a>
</div>

<div id="pages">
<div class="loading">Loading pages...</div>
</div>

<div class="nav">
<a id="prev2" class="btn">◀ Previous Volume</a>
<a id="next2" class="btn">Next Volume ▶</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const params = new URLSearchParams(location.search);
const id = params.get("id");
const ch = parseInt(params.get("ch") || "1");

async function start(){

  const book = await fetch(`data/${id}.json`).then(r=>r.json());
  const volume = book.chapters[ch-1];

  document.getElementById("title").textContent =
  `${book.title} — ${volume.title}`;

  const total = book.chapters.length;

  function link(btn,n){
    if(n<1||n>total){
      btn.style.visibility="hidden";
    }else{
      btn.href=`read.html?id=${id}&ch=${n}`;
    }
  }

  link(prev,ch-1);
  link(prev2,ch-1);
  link(next,ch+1);
  link(next2,ch+1);

  const pdf = await pdfjsLib.getDocument(volume.pdf).promise;

  const pages=document.getElementById("pages");
  pages.innerHTML="";

  for(let i=1;i<=pdf.numPages;i++){

    const page=await pdf.getPage(i);

    const viewport=page.getViewport({scale:1.8});

    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");

    canvas.width=viewport.width;
    canvas.height=viewport.height;

    await page.render({
      canvasContext:ctx,
      viewport
    }).promise;

    pages.appendChild(canvas);

  }

}

start().catch(err=>{
document.getElementById("pages").innerHTML=
`<div class="loading">Failed to load.<br>${err.message}</div>`;
});
</script>

</body>
</html>
