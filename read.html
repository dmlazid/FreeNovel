<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#eef2f1;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#333;
}

header{
    background:#00897b;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
}

header a{
    color:white;
    text-decoration:none;
    font-size:32px;
    font-weight:600;
}

.container{
    max-width:760px;
    margin:auto;
    padding:18px;
}

.title{
    color:#00897b;
    text-align:center;
    font-size:22px;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.4;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:18px;
    margin:12px 0 25px;
}

.reader{
    background:white;
    border-radius:18px;
    padding:28px;
    font-size:20px;
    line-height:1.9;
    white-space:pre-wrap;
    word-break:break-word;
}

.reader h2{
    font-size:28px;
    margin-bottom:20px;
}

.nav{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.nav a{
    flex:1;
    background:#00897b;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
}

@media(max-width:600px){
.reader{
font-size:18px;
padding:22px;
}
}
</style>
</head>
<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div id="bookTitle" class="title">Loading...</div>
<div id="chapterTitle" class="subtitle"></div>

<div id="content" class="reader">Loading...</div>

<div class="nav">
<a id="prev">◀ Previous</a>
<a id="next">Next ▶</a>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||1);

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());
const chapter=await fetch(`chapters/${id}/v${ch}.json`).then(r=>r.json());

bookTitle.textContent=book.title.toUpperCase();
chapterTitle.textContent=chapter.title;

let text=chapter.text;

// Automatically skip front matter
const prologue=text.search(/Prologue:/i);
const chapter1=text.search(/Chapter\\s*1:/i);

if(prologue!==-1){
text=text.slice(prologue);
}else if(chapter1!==-1){
text=text.slice(chapter1);
}

// Remove leftover headings
text=text
.replace(/^Table of Contents\\s*/i,"")
.replace(/^Cover\\s*/im,"")
.replace(/^Color Illustrations\\s*/im,"")
.trim();

content.textContent=text;

// Navigation
if(ch>1){
prev.href=`read.html?id=${id}&ch=${ch-1}`;
}else{
prev.style.visibility="hidden";
}

if(ch<book.chapters.length){
next.href=`read.html?id=${id}&ch=${ch+1}`;
}else{
next.style.visibility="hidden";
}

}

load().catch(err=>{
content.textContent=err.message;
});
</script>

</body>
</html>
