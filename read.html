<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeNovel Reader</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2f3}
header{background:#00897b;padding:15px}
header a{color:white;text-decoration:none;font-size:30px;display:flex;align-items:center;gap:10px}
.logo{width:42px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:white;border-radius:20px;padding:20px}
#pdf-canvas{width:100%;height:auto;border-radius:12px;background:white}
.controls{display:flex;justify-content:space-between;align-items:center;margin:15px 0;gap:10px}
button{background:#00897b;color:white;border:none;padding:12px 18px;border-radius:12px;font-size:16px}
button:disabled{opacity:.5}
.volumes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.volumes button{width:50px;height:50px;border-radius:50%;padding:0}
h1{text-align:center}
</style>
</head>
<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo">
FreeNovel
</a>
</header>

<div class="container">
<div class="card">

<h1 id="title">Loading...</h1>

<div id="volumeButtons" class="volumes"></div>

<div class="controls">
<button id="prev">◀ Prev</button>
<span id="pageInfo">Page 1</span>
<button id="next">Next ▶</button>
</div>

<canvas id="pdf-canvas"></canvas>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

const params=new URLSearchParams(location.search);
const id=params.get("id");
let volume=parseInt(params.get("ch")||0);

let pdfDoc=null;
let pageNum=1;
const canvas=document.getElementById("pdf-canvas");
const ctx=canvas.getContext("2d");

async function loadNovel(){

const novel=await fetch(`data/${id}.json`).then(r=>r.json());

document.getElementById("title").textContent=novel.title;

const holder=document.getElementById("volumeButtons");
holder.innerHTML="";

novel.chapters.forEach((v,i)=>{
const b=document.createElement("button");
b.textContent=i+1;
if(i===volume)b.style.background="#00695c";
b.onclick=()=>location.href=`read.html?id=${id}&ch=${i}`;
holder.appendChild(b);
});

pdfDoc=await pdfjsLib.getDocument(novel.chapters[volume].pdf).promise;

pageNum=1;
renderPage();

}

async function renderPage(){

const page=await pdfDoc.getPage(pageNum);

const viewport=page.getViewport({scale:1.5});

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({
canvasContext:ctx,
viewport
}).promise;

document.getElementById("pageInfo").textContent=
`Page ${pageNum} / ${pdfDoc.numPages}`;

document.getElementById("prev").disabled=pageNum===1;
document.getElementById("next").disabled=pageNum===pdfDoc.numPages;

}

document.getElementById("prev").onclick=()=>{
if(pageNum>1){pageNum--;renderPage();}
};

document.getElementById("next").onclick=()=>{
if(pageNum<pdfDoc.numPages){pageNum++;renderPage();}
};

loadNovel().catch(()=>{
document.querySelector(".card").innerHTML=
'<h2>Novel not found</h2><a href="index.html">Back Home</a>';
});
</script>

</body>
</html>
