<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeNovel Reader</title>

<style>
body{
  margin:0;
  background:#dfe5e5;
  font-family:Arial,sans-serif;
}
header{
  background:#00897b;
  color:#fff;
  padding:20px;
  font-size:38px;
}
header a{color:white;text-decoration:none;}

.card{
  background:white;
  margin:20px;
  border-radius:28px;
  padding:20px;
  text-align:center;
}

#pdfCanvas{
  width:100%;
  height:auto;
  border-radius:12px;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
}

button{
  background:#00897b;
  color:white;
  border:none;
  border-radius:30px;
  padding:14px 26px;
  font-size:20px;
}
</style>
</head>

<body>

<header><a href="index.html">📚 FreeNovel</a></header>

<div class="card">

<h1 id="title">Loading...</h1>

<canvas id="pdfCanvas"></canvas>

<div class="controls">
<button id="prev">◀ Prev</button>
<div id="pageInfo">Page 1 / 1</div>
<button id="next">Next ▶</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");
const ch=parseInt(params.get("ch")||"1");

let pdfDoc=null;
let pageNum=1;

async function renderPage(num){
 const page=await pdfDoc.getPage(num);
 const viewport=page.getViewport({scale:1.8});

 const canvas=document.getElementById("pdfCanvas");
 const ctx=canvas.getContext("2d");

 canvas.width=viewport.width;
 canvas.height=viewport.height;

 await page.render({canvasContext:ctx,viewport}).promise;

 document.getElementById("pageInfo").textContent=
 `Page ${num} / ${pdfDoc.numPages}`;

 document.getElementById("prev").disabled=num<=1;
 document.getElementById("next").disabled=num>=pdfDoc.numPages;
}

async function load(){

 const data=await fetch(`data/${id}.json`).then(r=>r.json());

 const chapter=data.chapters[ch-1];

 document.getElementById("title").textContent=
 `${data.title} — ${chapter.title}`;

 pdfjsLib.GlobalWorkerOptions.workerSrc=
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

 pdfDoc=await pdfjsLib.getDocument(chapter.pdf).promise;

 renderPage(1);

 document.getElementById("prev").onclick=()=>{
  if(pageNum>1){
   pageNum--;
   renderPage(pageNum);
  }
 };

 document.getElementById("next").onclick=()=>{
  if(pageNum<pdfDoc.numPages){
   pageNum++;
   renderPage(pageNum);
  }
 };
}

load().catch(e=>{
 document.querySelector(".card").innerHTML=
 `<h2>Error</h2><p>${e.message}</p>`;
});
</script>

</body>
</html>
