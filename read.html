<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FreeNovel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Poppins,sans-serif;
background:#e4e8e7;
color:#2b2b2b;
}

header{
background:#00897b;
height:82px;
display:flex;
align-items:center;
padding:0 18px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
color:white;
font-size:36px;
font-weight:500;
}

.brand img{
width:50px;
height:50px;
object-fit:contain;
}

.page{
max-width:720px;
margin:auto;
padding:22px 16px;
}

h1{
text-align:center;
color:#00897b;
font-size:34px;
font-weight:700;
line-height:1.3;
margin:18px 0 14px;
}

#volumeBtn{
display:block;
text-align:center;
font-size:30px;
color:#666;
text-decoration:none;
margin-bottom:22px;
cursor:pointer;
}

.controls{
display:grid;
grid-template-columns:2fr 1fr 80px;
gap:10px;
margin-bottom:18px;
}

select{
width:100%;
height:60px;
border:none;
border-radius:12px;
background:#00897b;
color:white;
padding:0 14px;
font:500 16px Poppins;
}

.reader{
background:white;
border-radius:24px;
padding:22px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

#chapterTitle{
font-size:32px;
font-weight:700;
margin-bottom:18px;
}

#content{
max-width:560px;
margin:auto;
font-size:18px;
line-height:2.05;
word-break:normal;
overflow-wrap:break-word;
}

#content p{
margin-bottom:22px;
}

.nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:26px;
}

.nav button{
height:60px;
border:none;
border-radius:12px;
background:#00897b;
color:white;
font:600 20px Poppins;
cursor:pointer;
}

.nav button:disabled{
background:#8cc8c0;
}

#topBtn{
position:fixed;
right:18px;
bottom:18px;
width:54px;
height:54px;
border:none;
border-radius:50%;
background:#d7b24b;
color:white;
font-size:24px;
display:none;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="brand">
<img src="logo.png" onerror="this.style.display='none';document.getElementById('fallback').style.display='inline';">
<span id="fallback" style="display:none;">📚</span>
<span>FreeNovel</span>
</a>
</header>

<div class="page">

<h1>[New Life+] Young Again in Another World</h1>

<a id="volumeBtn">Volume 1 ▼</a>

<div class="controls">

<select id="chapterSelect"></select>

<select id="fontSelect">
<option selected>Poppins</option>
<option>Georgia</option>
<option>Arial</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
</select>

</div>

<div class="reader">

<div id="chapterTitle">Loading...</div>

<div id="content">Loading...</div>

<div class="nav">
<button id="prev">◀ Previous</button>
<button id="next">Next ▶</button>
</div>

</div>

</div>

<button id="topBtn">↑</button>

<script>

const files=[
'texts/new-life-young-again-v1.txt',
'texts/new-life-young-again-v2.txt',
'texts/new-life-young-again-v3.txt'
];

let volume=0;
let current=0;
let chapters=[];

const volumeBtn=document.getElementById('volumeBtn');
const chapterSelect=document.getElementById('chapterSelect');
const chapterTitle=document.getElementById('chapterTitle');
const content=document.getElementById('content');
const fontSelect=document.getElementById('fontSelect');
const sizeSelect=document.getElementById('sizeSelect');
const prev=document.getElementById('prev');
const next=document.getElementById('next');

volumeBtn.onclick=()=>{
volume=(volume+1)%3;
volumeBtn.textContent=`Volume ${volume+1} ▼`;
loadVolume();
};

async function loadVolume(){

let text=await fetch(files[volume]).then(r=>r.text());

text=text.replace(/\r/g,'');

/* REMOVE TOC */

const heads=[...text.matchAll(/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm)];

if(heads.length){

if(volume===0){

const p=[...text.matchAll(/^Prologue:/gm)];
if(p.length>=2) text=text.slice(p[1].index);
else text=text.slice(heads[0].index);

}else if(volume===1){

/* V2 fix */
let start=heads[0].index;

for(let i=0;i<heads.length-1;i++){

const gap=heads[i+1].index-heads[i].index;

if(gap>300){

start=heads[i].index;
break;

}

}

text=text.slice(start);

}else{

text=text.slice(heads[0].index);

}

}

const after=text.search(/^Afterword/m);

if(after!=-1)
text=text.slice(0,after);

/* SPLIT */

chapters=[];

const matches=[...text.matchAll(/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*)$/gm)];

for(let i=0;i<matches.length;i++){

const start=matches[i].index;
const end=i+1<matches.length?matches[i+1].index:text.length;

let title=matches[i][0];

if(title.startsWith('Prologue'))
title='Chapter 1';

let body=text.slice(start+matches[i][0].length,end).trim();

chapters.push({title,body});

}

if(!chapters.length)
chapters=[{title:'Chapter 1',body:text.trim()}];

chapterSelect.innerHTML='';

chapters.forEach((c,i)=>{
chapterSelect.innerHTML+=`<option value="${i}">${c.title}</option>`;
});

current=0;
show();

}

function show(){

const ch=chapters[current];

chapterTitle.textContent=ch.title;

content.innerHTML=ch.body
.split(/\n\s*\n/)
.map(p=>`<p>${p.trim()}</p>`)
.join('');

content.style.fontFamily=fontSelect.value;
content.style.fontSize=sizeSelect.value+'px';

chapterSelect.value=current;

prev.disabled=current===0;
next.disabled=current===chapters.length-1;

window.scrollTo({top:0,behavior:'smooth'});

}

chapterSelect.onchange=()=>{
current=+chapterSelect.value;
show();
};

fontSelect.onchange=show;
sizeSelect.onchange=show;

prev.onclick=()=>{
if(current>0){
current--;
show();
}
};

next.onclick=()=>{
if(current<chapters.length-1){
current++;
show();
}
};

const topBtn=document.getElementById('topBtn');

window.addEventListener('scroll',()=>{
topBtn.style.display=window.scrollY>500?'block':'none';
});

topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

loadVolume();

</script>

</body>
</html>
