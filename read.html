<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#e7eceb;
font-family:Poppins,sans-serif;
}

header{
background:#00897b;
padding:16px;
position:sticky;
top:0;
z-index:100;
}

.logo{
height:48px;
}

.wrap{
max-width:760px;
margin:auto;
padding:18px;
}

.title{
text-align:center;
color:#00897b;
font-size:22px;
font-weight:700;
}

.subtitle{
text-align:center;
font-size:16px;
color:#666;
margin-bottom:18px;
}

.controls{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-bottom:15px;
}

select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#00897b;
color:white;
font-family:Poppins;
font-size:16px;
}

.reader{
background:white;
border-radius:18px;
padding:26px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

#chapterTitle{
font-size:28px;
font-weight:700;
margin-bottom:22px;
line-height:1.35;
}

#content{
font-size:18px;
line-height:1.95;
color:#222;
white-space:pre-wrap;
word-break:break-word;
}

.nav{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:24px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:12px;
background:#00897b;
color:white;
font-family:Poppins;
font-size:17px;
font-weight:600;
}

button:disabled{
opacity:.45;
}

</style>
</head>
<body>

<header>
<a href="index.html">
<img src="assets/logo.png" class="logo">
</a>
</header>

<div class="wrap">

<div class="title" id="novelTitle"></div>
<div class="subtitle" id="volumeTitle"></div>

<div class="controls">

<select id="chapterSelect"></select>

<select id="fontSelect">
<option value="Poppins">Poppins</option>
<option value="Georgia">Serif</option>
<option value="Arial">Sans</option>
</select>

<select id="sizeSelect">
<option>16</option>
<option selected>18</option>
<option>20</option>
<option>22</option>
<option>24</option>
<option>26</option>
<option>28</option>
<option>30</option>
</select>

</div>

<div class="reader">

<div id="chapterTitle"></div>

<div id="content"></div>

<div class="nav">

<button id="prev">◀ Previous</button>

<button id="next">Next ▶</button>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const id=params.get("id");

const volume=Number(params.get("ch")||0);

let chapters=[];

let current=0;

const content=document.getElementById("content");

const chapterTitle=document.getElementById("chapterTitle");

const chapterSelect=document.getElementById("chapterSelect");

const prev=document.getElementById("prev");

const next=document.getElementById("next");

const fontSelect=document.getElementById("fontSelect");

const sizeSelect=document.getElementById("sizeSelect");

function savePrefs(){

localStorage.setItem("readerFont",fontSelect.value);

localStorage.setItem("readerSize",sizeSelect.value);

content.style.fontFamily=fontSelect.value;

content.style.fontSize=sizeSelect.value+"px";

}

fontSelect.onchange=savePrefs;

sizeSelect.onchange=savePrefs;

fontSelect.value=localStorage.getItem("readerFont")||"Poppins";

sizeSelect.value=localStorage.getItem("readerSize")||"18";

savePrefs();

function splitChapters(text){

text=text.replace(/\r/g,"");

text=text.replace(/Table of Contents[\s\S]*?(?=Prologue:|Chapter\s+1:)/i,"");

const first=text.indexOf("Prologue:");

if(first>0)text=text.slice(first);

const regex=/^(Prologue:.*|Chapter\s+\d+:.*|Interlude:.*|Epilogue:.*|Afterword.*)$/gm;

const matches=[...text.matchAll(regex)];

const arr=[];

for(let i=0;i<matches.length;i++){

const start=matches[i].index;

const end=i+1<matches.length?matches[i+1].index:text.length;

arr.push({

title:matches[i][0].trim(),

body:text.slice(start,end).replace(matches[i][0],"").trim()

});

}

return arr;

}

async function load(){

const novel=await fetch(`data/${id}.json`).then(r=>r.json());

document.getElementById("novelTitle").textContent=novel.title;

document.getElementById("volumeTitle").textContent=novel.chapters[volume].title;

const txt=await fetch(novel.chapters[volume].text).then(r=>r.text());

chapters=splitChapters(txt);

chapterSelect.innerHTML="";

chapters.forEach((c,i)=>{

const o=document.createElement("option");

o.value=i;

o.textContent=c.title;

chapterSelect.appendChild(o);

});

current=Number(params.get("c")||0);

show();

}

function show(){

chapterSelect.value=current;

chapterTitle.textContent=chapters[current].title;

content.textContent=chapters[current].body;

prev.disabled=current===0;

next.disabled=current===chapters.length-1;

history.replaceState({},'',`?id=${id}&ch=${volume}&c=${current}`);

window.scrollTo({top:0});

}

chapterSelect.onchange=()=>{

current=Number(chapterSelect.value);

show();

};

prev.onclick=()=>{

if(current>0){

current--;

show();

}

};

next.onclick=()=>{

if(current<chapters.length-1){

current++;

show();

}

};

load().catch(e=>{

chapterTitle.textContent="Error";

content.textContent=e.message;

});

</script>

</body>
</html>
