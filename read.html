<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FreeNovel Reader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#f3f3f3;
    font-family:'Poppins',sans-serif;
    color:#333;
}

header{
    background:#00897b;
    padding:18px;
}

header a{
    color:white;
    text-decoration:none;
    font-size:42px;
    font-weight:400;
}

.container{
    max-width:760px;
    margin:auto;
    padding:20px;
}

.book-title{
    color:#00897b;
    font-size:24px;
    font-weight:700;
    text-transform:uppercase;
    text-align:center;
    line-height:1.35;
}

.chapter-title{
    margin-top:18px;
    text-align:center;
    font-size:19px;
    color:#666;
    font-weight:500;
}

.reader-buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:25px 0;
}

.icon-btn{
    width:58px;
    height:58px;
    background:#00897b;
    border:none;
    color:white;
    font-size:24px;
    border-radius:4px;
    cursor:pointer;
}

.divider{
    text-align:center;
    font-size:34px;
    color:#888;
    margin:10px 0 25px;
}

#content{
    background:white;
    padding:28px;
    border-radius:10px;
    font-family:'Poppins',sans-serif;
    font-size:18px;
    line-height:2;
    white-space:pre-wrap;
}

.bottom-nav{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin:30px 0;
}

.nav-btn{
    flex:1;
    background:#00897b;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:16px;
    border-radius:6px;
    font-size:18px;
    font-weight:600;
}

@media(max-width:600px){

.book-title{font-size:22px;}
.chapter-title{font-size:18px;}
#content{
    font-size:17px;
    padding:22px;
    line-height:1.95;
}

}
</style>
</head>

<body>

<header>
<a href="index.html">📚 FreeNovel</a>
</header>

<div class="container">

<div class="book-title" id="bookTitle">Loading...</div>

<div class="chapter-title" id="chapterTitle"></div>

<div class="reader-buttons">

<button class="icon-btn" id="smaller">A−</button>

<button class="icon-btn" id="theme">⚙</button>

<button class="icon-btn" id="bigger">A+</button>

</div>

<div class="divider">〰</div>

<div id="content">Loading chapter...</div>

<div class="bottom-nav">

<a id="prev" class="nav-btn">❮ Previous</a>

<a id="next" class="nav-btn">Next ❯</a>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const q=new URLSearchParams(location.search);
const id=q.get("id");
const ch=parseInt(q.get("ch")||1);

const content=document.getElementById("content");
let size=18;

smaller.onclick=()=>{
size=Math.max(15,size-1);
content.style.fontSize=size+"px";
}

bigger.onclick=()=>{
size=Math.min(24,size+1);
content.style.fontSize=size+"px";
}

let dark=false;

theme.onclick=()=>{
dark=!dark;

document.body.style.background=dark?"#111":"#f3f3f3";
content.style.background=dark?"#1d1d1d":"white";
content.style.color=dark?"#eee":"#333";
}

async function load(){

const book=await fetch(`data/${id}.json`).then(r=>r.json());

const volume=book.chapters[ch-1];

bookTitle.textContent=book.title.toUpperCase();

chapterTitle.textContent=volume.title;

const pdf=await pdfjsLib.getDocument(volume.pdf).promise;

let text="";

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);

const txt=await page.getTextContent();

let lastY=null;

txt.items.forEach(i=>{

const y=i.transform[5];

if(lastY!==null&&Math.abs(y-lastY)>8)
text+="\n";

text+=i.str+" ";

lastY=y;

});

text+="\n\n";

}

content.textContent=text.trim();

if(ch>1)
prev.href=`read.html?id=${id}&ch=${ch-1}`;
else
prev.style.visibility="hidden";

if(ch<book.chapters.length)
next.href=`read.html?id=${id}&ch=${ch+1}`;
else
next.style.visibility="hidden";

}

load().catch(e=>{
content.textContent=e.message;
});
</script>

</body>
</html>
